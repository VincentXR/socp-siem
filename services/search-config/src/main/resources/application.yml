server:
  port: 18081
  servlet:
    context-path: /search-config

spring:
  application:
    name: search-config
  datasource:
    # 本地切片用 H2 文件库（重启不丢）；Docker 环境改 url 指向 search 库 PG
    url: jdbc:h2:file:${user.home}/.socp/search;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Flyway 接管 schema，Hibernate 不再自动改表
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # 老库（ddl-auto=update 建的表 + 数据）标记为 version 0 后再迁移，不清库
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# 采集管线转发归一化事件的目标（DETECT 检测引擎）
socp:
  health:
    required-endpoints: ${SOCP_HEALTH_REQUIRED_ENDPOINTS:kafka=localhost:9092,opensearch=localhost:9200,detect=localhost:18082}
    connect-timeout-ms: ${SOCP_HEALTH_CONNECT_TIMEOUT_MS:500}
  search:
    # all keeps the local single-process profile; api and worker can be
    # deployed separately while sharing the durable event/outbox database.
    runtime-role: ${SOCP_SEARCH_RUNTIME_ROLE:all}
    local-cache:
      idle-ttl-ms: ${SOCP_SEARCH_CACHE_IDLE_TTL_MS:1800000}
      max-tenants: ${SOCP_SEARCH_CACHE_MAX_TENANTS:100}
      # Warm-up is paged and concurrency-limited; byte values are cache-weight
      # estimates, not exact JVM retained-heap measurements.
      warmup-max-events: ${SOCP_SEARCH_CACHE_WARMUP_MAX_EVENTS:2000}
      warmup-batch-size: ${SOCP_SEARCH_CACHE_WARMUP_BATCH_SIZE:128}
      max-concurrent-warmups: ${SOCP_SEARCH_CACHE_MAX_CONCURRENT_WARMUPS:2}
      max-bytes-per-tenant: ${SOCP_SEARCH_CACHE_MAX_BYTES_PER_TENANT:16777216}
      # Must be >= max-bytes-per-tenant; contradictory budgets fail at startup.
      max-bytes-total: ${SOCP_SEARCH_CACHE_MAX_BYTES_TOTAL:268435456}
      cleanup-interval-ms: ${SOCP_SEARCH_CACHE_CLEANUP_INTERVAL_MS:60000}
    event-retention:
      # PostgreSQL is a bounded idempotency/fallback copy, not the long-term search authority.
      # Keep this >= the maximum producer/Kafka replay horizon expected by the deployment.
      retention-ms: ${SOCP_SEARCH_EVENT_RETENTION_MS:2592000000}
      cleanup-batch-size: ${SOCP_SEARCH_EVENT_CLEANUP_BATCH_SIZE:1000}
      # Per catch-up round. Backlog can run multiple rounds, each still bounded.
      cleanup-max-batches: ${SOCP_SEARCH_EVENT_CLEANUP_MAX_BATCHES:10}
      cleanup-max-run-ms: ${SOCP_SEARCH_EVENT_CLEANUP_MAX_RUN_MS:30000}
      cleanup-catchup-pause-ms: ${SOCP_SEARCH_EVENT_CLEANUP_CATCHUP_PAUSE_MS:100}
      cleanup-interval-ms: ${SOCP_SEARCH_EVENT_CLEANUP_INTERVAL_MS:3600000}
      cleanup-initial-delay-ms: ${SOCP_SEARCH_EVENT_CLEANUP_INITIAL_DELAY_MS:60000}
    config-cache:
      # 采集链路配置缓存的跨副本收敛窗口：本副本写入即时失效，
      # 其它 SEARCH 副本写入的配置最迟一个 TTL 后对本副本可见。
      ttl-ms: ${SOCP_SEARCH_CONFIG_CACHE_TTL_MS:60000}
  # 演示数据开关：与其他服务同键同口径；prod profile 强制 false（docs/adr/004-runtime-profiles.md）。
  demo-data:
    enabled: ${SOCP_DEMO_DATA_ENABLED:true}
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
    # Per-collector credentials: id|tenant|secret;id2|tenant|secret.
    collector-credentials: ${SOCP_COLLECTOR_CREDENTIALS:}
    allow-global-ingest-token: ${SOCP_ALLOW_GLOBAL_INGEST_TOKEN:true}
    # 机机采集凭据：Vector 渲染配置里 Authorization 头的值（socp.vector.token）匹配即放行，
    # 否则采集器在 dev-bypass=false 下会被 401 挡在链路外。
    ingest-token: ${SOCP_INGEST_TOKEN:dev-vector-token}
  vector:
    # 渲染 Vector 配置时注入的采集 token（Authorization: Bearer），与 Vector sink 约定一致；
    # dev-bypass=false 时 ingest 校验此 token，缺失/不匹配返回 401。
    token: ${SOCP_VECTOR_TOKEN:dev-vector-token}
    # 平台采集入口地址：日志源未绑定输出目标时渲染器用它。留空即渲染失败（HTTP 409），
    # 不再兜底到进程内硬编码的 localhost；prod profile 必须显式设置本服务的可达地址。
    uri: ${SOCP_VECTOR_URI:http://localhost:18081/search-config/api/v1/ingest}
  kafka:
    bootstrap: ${SOCP_KAFKA_BOOTSTRAP:localhost:9092}
    topic: ${SOCP_KAFKA_TOPIC:socp-events}
    enabled: ${SOCP_KAFKA_ENABLED:true}
  detect:
    url: ${SOCP_DETECT_URL:http://localhost:18082}
  ingest:
    limits:
      max-body-bytes: ${SOCP_INGEST_MAX_BODY_BYTES:16777216}
      max-events: ${SOCP_INGEST_MAX_EVENTS:1000}
      max-event-bytes: ${SOCP_INGEST_MAX_EVENT_BYTES:262144}
    monitor:
      idle-ttl-ms: ${SOCP_INGEST_MONITOR_IDLE_TTL_MS:86400000}
      max-entries: ${SOCP_INGEST_MONITOR_MAX_ENTRIES:10000}
      cleanup-interval-ms: ${SOCP_INGEST_MONITOR_CLEANUP_INTERVAL_MS:3600000}
    outbox:
      poll-interval-ms: ${SOCP_INGEST_OUTBOX_POLL_MS:500}
      initial-delay-ms: ${SOCP_INGEST_OUTBOX_INITIAL_DELAY_MS:1000}
      delivery-concurrency: ${SOCP_INGEST_OUTBOX_CONCURRENCY:8}
      max-attempts: ${SOCP_INGEST_OUTBOX_MAX_ATTEMPTS:12}
      retention-ms: ${SOCP_INGEST_OUTBOX_RETENTION_MS:2592000000}
      cleanup-batch-size: ${SOCP_INGEST_OUTBOX_CLEANUP_BATCH_SIZE:1000}
      cleanup-max-batches: ${SOCP_INGEST_OUTBOX_CLEANUP_MAX_BATCHES:10}
      cleanup-interval-ms: ${SOCP_INGEST_OUTBOX_CLEANUP_INTERVAL_MS:3600000}
      cleanup-initial-delay-ms: ${SOCP_INGEST_OUTBOX_CLEANUP_INITIAL_DELAY_MS:60000}
  os-indexer:
    retry-backoff-ms: ${SOCP_OS_INDEXER_RETRY_BACKOFF_MS:1000}
  opensearch:
    enabled: ${SOCP_OPENSEARCH_ENABLED:true}
    url: ${SOCP_OPENSEARCH_URL:https://localhost:9200}
    username: ${SOCP_OPENSEARCH_USERNAME:admin}
    password: ${SOCP_OPENSEARCH_PASSWORD:Socp!Sec2026xK}
    tls:
      insecure-skip-verify: ${SOCP_OPENSEARCH_INSECURE_SKIP_VERIFY:true}
      trust-store: ${SOCP_OPENSEARCH_TRUST_STORE:}
      trust-store-password: ${SOCP_OPENSEARCH_TRUST_STORE_PASSWORD:}

# 避开 8080（旧 SIEM 控制台占用）；与 alert-web(18080)/api-gateway(18092) 同处 18080~18092 段
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,socpDependencies
