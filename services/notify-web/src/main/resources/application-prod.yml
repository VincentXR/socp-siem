spring:
  config:
    import: classpath:application-pg.yml
  mail:
    host: ${SOCP_SMTP_HOST:}
    port: ${SOCP_SMTP_PORT:587}
    username: ${SOCP_SMTP_USERNAME:}
    password: ${SOCP_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SOCP_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SOCP_SMTP_STARTTLS:true}
      # Jakarta Mail defaults every timeout to infinite wait: a peer that
      # accepts TCP but never responds would pin the dispatch worker and the
      # request thread forever. Bound all three phases explicitly.
      mail.smtp.connectiontimeout: ${SOCP_SMTP_CONNECTION_TIMEOUT_MS:3000}
      mail.smtp.timeout: ${SOCP_SMTP_TIMEOUT_MS:3000}
      mail.smtp.writetimeout: ${SOCP_SMTP_WRITE_TIMEOUT_MS:3000}

socp:
  demo-data:
    enabled: false
  notify:
    smtp:
      enabled: ${SOCP_NOTIFY_SMTP_ENABLED:false}
      from: ${SOCP_NOTIFY_SMTP_FROM:}
