server:
  port: 18093
  servlet:
    context-path: /hips-collect

spring:
  application:
    name: hips-collect

socp:
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
  hips:
    url: ${SOCP_HIPS_URL:http://localhost:18087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
