server:
  port: ${SOCP_GATEWAY_PORT:18092}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 2025.0 起配置键迁移到 spring.cloud.gateway.server.webflux.*
      # 旧键（spring.cloud.gateway.routes）仍被临时兼容，但会打 migration 警告。
      server:
        webflux:
          # 统一北向入口：按 context-path 路由到各业务服务。
          # 下游服务本身配了 server.servlet.context-path，所以这里不做 StripPrefix，
          # /alert-web/api/xx 原样转发到 http://host:18080/alert-web/api/xx。
          # 本地切片走 localhost:180xx；Docker 环境用环境变量覆盖成 http://<service>:8080。
          routes:
            - id: alert-web
              uri: ${SOCP_SSA_URI:http://localhost:18080}
              predicates:
                - Path=/alert-web/**
            - id: search-config
              uri: ${SOCP_GLS_URI:http://localhost:18081}
              predicates:
                - Path=/search-config/**
            # Detection management remains on the API process, while the
            # runtime read/ingest surfaces are owned by the worker in split
            # deployments. Keep the browser contract stable and route only
            # those paths to the worker.
            - id: detect-web-runtime
              uri: ${SOCP_GAS_WORKER_URI:http://localhost:18082}
              predicates:
                - Path=/detect-web/api/v1/stats,/detect-web/api/v1/alerts,/detect-web/api/v1/stream,/detect-web/api/v1/ingest,/detect-web/api/v1/ingest/**
            - id: detect-web
              uri: ${SOCP_GAS_WEB_URI:http://localhost:18082}
              predicates:
                - Path=/detect-web/**
            - id: soar-web
              uri: ${SOCP_SOAR_URI:http://localhost:18083}
              predicates:
                - Path=/soar-web/**
            - id: report-web
              uri: ${SOCP_SFM_URI:http://localhost:18084}
              predicates:
                - Path=/report-web/**
            - id: asset-web
              uri: ${SOCP_SAM_WEB_URI:http://localhost:18085}
              predicates:
                - Path=/asset-web/**
            - id: soc-base
              uri: ${SOCP_SOC_URI:http://localhost:18086}
              predicates:
                - Path=/soc-base/**
            - id: hips-web
              uri: ${SOCP_HIPS_WEB_URI:http://localhost:18087}
              predicates:
                - Path=/hips-web/**
            - id: ai-assistant
              uri: ${SOCP_AI_URI:http://localhost:18088}
              predicates:
                - Path=/ai-assistant/**
            - id: detect-model
              # Compatibility surface owned by the Detection worker. Keep the
              # public path stable while avoiding a second JVM; persistence stays separate.
              uri: ${SOCP_GAS_MODEL_URI:${SOCP_GAS_WORKER_URI:http://localhost:18082}}
              predicates:
                - Path=/detect-model/**
              filters:
                - RewritePath=/detect-model/?(?<segment>.*), /detect-web/model/$\{segment}
            - id: asset-collect
              # Compatibility route: the collection ingress is hosted by asset-web.
              uri: ${SOCP_SAM_COLLECT_URI:http://localhost:18085}
              predicates:
                - Path=/asset-collect/**
              filters:
                - RewritePath=/asset-collect/?(?<segment>.*), /asset-web/$\{segment}
            - id: hips-collect
              # Compatibility route: the collection ingress is hosted by hips-web.
              uri: ${SOCP_HIPS_COLLECT_URI:http://localhost:18087}
              predicates:
                - Path=/hips-collect/**
              filters:
                - RewritePath=/hips-collect/?(?<segment>.*), /hips-web/$\{segment}
            - id: threat-web
              uri: ${SOCP_TI_URI:http://localhost:18094}
              predicates:
                - Path=/threat-web/**
            - id: attack-web
              uri: ${SOCP_ATTACK_URI:http://localhost:18095}
              predicates:
                - Path=/attack-web/**
            - id: notify-web
              uri: ${SOCP_NOTIFY_URI:http://localhost:18096}
              predicates:
                - Path=/notify-web/**
            - id: incident-web
              uri: ${SOCP_CASE_URI:http://localhost:18097}
              predicates:
                - Path=/incident-web/**
          # 生产应开启：RequestRateLimiter（Redis）+ CircuitBreaker
          default-filters: []

# 网关鉴权：外部 OIDC 只验证登录身份；浏览器与机机平台会话由网关重新签发。
# 生产使用 socp.auth.signing-jwk 的 RSA 私钥，公钥由 /.well-known/socp-jwks.json 发布，
# 所有服务以 socp.security.issuer-uri/jwk-set-uri 验证同一个平台 issuer。
socp:
  security:
    # 生产指向 SOCP 平台 issuer/JWKS，不要填写外部 OIDC provider；后者在 socp.oidc 下独立配置。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
    service-secret: ${SOCP_SECURITY_SERVICE_SECRET:}
    require-gateway: ${SOCP_SECURITY_REQUIRE_GATEWAY:false}
  health:
    # Downstream probes are gateway-owned and cached; browsers never fan out
    # to every service on their own.
    cache-ms: ${SOCP_GATEWAY_HEALTH_CACHE_MS:30000}
    probe-timeout-ms: ${SOCP_GATEWAY_HEALTH_PROBE_TIMEOUT_MS:1000}
  auth:
    # 生产必须注入带 kid 的 RSA private JWK；login-secret 仅是 dev profile 的 HMAC 回退。
    signing-jwk: ${SOCP_AUTH_SIGNING_JWK:}
    issuer: ${SOCP_AUTH_ISSUER:${SOCP_SECURITY_ISSUER_URI:socp-gateway}}
    login-secret: ${SOCP_LOGIN_SECRET:}
    users: ${SOCP_AUTH_USERS:}
    roles: ${SOCP_AUTH_ROLES:}
    # Optional per-user BCP-47 locale map, for example {"analyst":"en-US"}.
    locales: ${SOCP_AUTH_LOCALES:}
    cookie-secure: ${SOCP_AUTH_COOKIE_SECURE:false}
    allowed-origins: ${SOCP_AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:18092}
    revocation:
      backend: ${SOCP_AUTH_REVOCATION_BACKEND:redis}
      redis-key-prefix: ${SOCP_AUTH_REVOCATION_REDIS_PREFIX:socp:auth:revoked:}
    rate-limit:
      login-permits: ${SOCP_AUTH_LOGIN_PERMITS:5}
      service-permits: ${SOCP_AUTH_SERVICE_PERMITS:10}
      window-seconds: ${SOCP_AUTH_WINDOW_SECONDS:60}

  ratelimit:
    backend: ${SOCP_RATELIMIT_BACKEND:memory}
    fail-closed: ${SOCP_RATELIMIT_FAIL_CLOSED:false}
    local-max-entries: ${SOCP_RATELIMIT_LOCAL_MAX_ENTRIES:10000}

  # OIDC 登录（PKCE 授权码）：外部 IdP 只作身份源，网关回调后统一签发
  # RSA 平台会话，业务服务只信任平台 JWKS。空 issuer 表示未配置 SSO。
  oidc:
    issuer-uri: ${SOCP_OIDC_ISSUER_URI:}
    client-id: ${SOCP_OIDC_CLIENT_ID:socp-spa}
    response-body-limit-bytes: ${SOCP_OIDC_RESPONSE_BODY_LIMIT_BYTES:1048576}
    redirect-uri: ${SOCP_OIDC_REDIRECT_URI:http://localhost:18092/auth/oidc/callback}
    frontend-url: ${SOCP_OIDC_FRONTEND_URL:http://localhost:5173}
    state:
      # Redis is the normal runtime backing so an authorization callback may
      # land on any gateway instance. application-dev.yml opts into memory.
      backend: ${SOCP_OIDC_STATE_BACKEND:redis}
      redis-key-prefix: ${SOCP_OIDC_STATE_REDIS_PREFIX:socp:oidc:state:}

management:
  endpoints:
    web:
      # Gateway route tables and Prometheus samples can disclose internal topology
      # and runtime labels. The public application port exposes health only;
      # metrics should be scraped through a dedicated internal management path/port.
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
