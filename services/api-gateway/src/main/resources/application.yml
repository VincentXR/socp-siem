server:
  port: ${SOCP_GATEWAY_PORT:18092}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 2025.0 起配置键迁移到 spring.cloud.gateway.server.webflux.*
      # 旧键（spring.cloud.gateway.routes）仍被临时兼容，但会打 migration 警告。
      server:
        webflux:
          # 统一北向入口：按 context-path 路由到各业务服务。
          # 下游服务本身配了 server.servlet.context-path，所以这里不做 StripPrefix，
          # /alert-web/api/xx 原样转发到 http://host:18080/alert-web/api/xx。
          # 本地切片走 localhost:180xx；Docker 环境用环境变量覆盖成 http://<service>:8080。
          routes:
            - id: alert-web
              uri: ${SOCP_SSA_URI:http://localhost:18080}
              predicates:
                - Path=/alert-web/**
            - id: search-config
              uri: ${SOCP_GLS_URI:http://localhost:18081}
              predicates:
                - Path=/search-config/**
            - id: detect-web
              uri: ${SOCP_GAS_WEB_URI:http://localhost:18082}
              predicates:
                - Path=/detect-web/**
            - id: soar-web
              uri: ${SOCP_SOAR_URI:http://localhost:18083}
              predicates:
                - Path=/soar-web/**
            - id: report-web
              uri: ${SOCP_SFM_URI:http://localhost:18084}
              predicates:
                - Path=/report-web/**
            - id: asset-web
              uri: ${SOCP_SAM_WEB_URI:http://localhost:18085}
              predicates:
                - Path=/asset-web/**
            - id: soc-base
              uri: ${SOCP_SOC_URI:http://localhost:18086}
              predicates:
                - Path=/soc-base/**
            - id: hips-web
              uri: ${SOCP_HIPS_WEB_URI:http://localhost:18087}
              predicates:
                - Path=/hips-web/**
            - id: ai-assistant
              uri: ${SOCP_AI_URI:http://localhost:18088}
              predicates:
                - Path=/ai-assistant/**
            - id: detect-model
              uri: ${SOCP_GAS_MODEL_URI:http://localhost:18090}
              predicates:
                - Path=/detect-model/**
            - id: asset-collect
              uri: ${SOCP_SAM_COLLECT_URI:http://localhost:18091}
              predicates:
                - Path=/asset-collect/**
            - id: hips-collect
              uri: ${SOCP_HIPS_COLLECT_URI:http://localhost:18093}
              predicates:
                - Path=/hips-collect/**
            - id: threat-web
              uri: ${SOCP_TI_URI:http://localhost:18094}
              predicates:
                - Path=/threat-web/**
            - id: attack-web
              uri: ${SOCP_ATTACK_URI:http://localhost:18095}
              predicates:
                - Path=/attack-web/**
            - id: notify-web
              uri: ${SOCP_NOTIFY_URI:http://localhost:18096}
              predicates:
                - Path=/notify-web/**
            - id: incident-web
              uri: ${SOCP_CASE_URI:http://localhost:18097}
              predicates:
                - Path=/incident-web/**
          # 生产应开启：RequestRateLimiter（Redis）+ CircuitBreaker
          default-filters: []

# 网关鉴权：与业务服务共用 socp-auth 的 JwtValidator（HMAC HS256，与 /auth/login 签发 secret 一致）。
# 登录签发 secret 走 socp.auth.login-secret（无默认值，必须显式提供）；验签走 socp.security.jwt-secret。
socp:
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
  auth:
    # 本地账号表由 application-dev.yml 提供（仅 dev profile）；生产请接 Keycloak/OIDC 或外部身份源。
    login-secret: ${SOCP_LOGIN_SECRET}
    users: ${SOCP_AUTH_USERS:}
    roles: ${SOCP_AUTH_ROLES:}

  # Keycloak OIDC 登录（PKCE 授权码，2026-08-12）：Keycloak 只作身份源，
  # 网关回调后统一签发 HS256 session token，业务服务保持 HMAC 验签零改动。
  oidc:
    issuer-uri: ${SOCP_OIDC_ISSUER_URI:http://localhost:8083/realms/socp}
    client-id: ${SOCP_OIDC_CLIENT_ID:socp-spa}
    redirect-uri: ${SOCP_OIDC_REDIRECT_URI:http://localhost:18092/auth/oidc/callback}
    frontend-url: ${SOCP_OIDC_FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always
