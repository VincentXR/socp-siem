# 仅开发环境（--spring.profiles.active=dev / SOCP_PROFILE=dev）提供演示账号与 secret 默认值。
# 生产禁止启用本 profile；密钥必须通过 SOCP_JWT_SECRET / SOCP_LOGIN_SECRET 环境变量注入。
socp:
  oidc:
    state:
      backend: memory
  security:
    dev-bypass: ${SOCP_DEV_BYPASS:false}
  auth:
    login-secret: ${SOCP_LOGIN_SECRET:socp-demo-jwt-secret-0123456789abcdef0123456789abcdef}
    # 账号表为 JSON 字符串（AuthController 启动时解析为 Map）
    users: '{"admin": "admin123", "demo": "demo123", "viewer": "viewer123"}'
    roles: '{"admin": "admin", "demo": "analyst", "viewer": "viewer"}'
