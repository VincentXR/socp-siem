server:
  port: 18084
  servlet:
    context-path: /report-web

spring:
  application:
    name: report-web

# 报表聚合统计来源（ALERT 告警库）
socp:
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
  alert:
    url: http://localhost:18080
  ck:
    url: ${SOCP_CK_URL:http://localhost:8123}
    user: ${SOCP_CK_USER:default}
    password: ${SOCP_CK_PASSWORD:socp}
    enabled: ${SOCP_CK_ENABLED:true}
  minio:
    url: ${SOCP_MINIO_URL:http://localhost:9000}
    access-key: ${SOCP_MINIO_ACCESS:socp}
    secret-key: ${SOCP_MINIO_SECRET:Socp@2026}
    bucket: ${SOCP_MINIO_BUCKET:socp-reports}
    enabled: ${SOCP_MINIO_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
