server:
  port: 18082
  servlet:
    context-path: /detect-web

spring:
  application:
    name: detect-web
  # 规则持久化（2026-08-10）：H2 文件库 + Flyway，重启不丢；生产可切 PostgreSQL
  datasource:
    url: jdbc:h2:file:${user.home}/.socp/detect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# 告警转发目标（ALERT 告警库）
socp:
  health:
    required-endpoints: ${SOCP_HEALTH_REQUIRED_ENDPOINTS:kafka=localhost:9092,alert=localhost:18080}
    connect-timeout-ms: ${SOCP_HEALTH_CONNECT_TIMEOUT_MS:500}
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
  alert:
    url: ${SOCP_ALERT_URL:http://localhost:18080}
  detect:
    # all keeps the local single-process profile; api exposes rule/query
    # management while worker owns Kafka, rule-change and alert-outbox loops.
    runtime-role: ${SOCP_DETECT_RUNTIME_ROLE:all}
    # A JVM-unique id is the fallback identity for the database state-unit
    # lease; set SOCP_DETECT_INSTANCE_ID when operators need a stable label.
    instance-id: ${SOCP_DETECT_INSTANCE_ID:${random.uuid}}
    engine:
      idle-ttl-ms: ${SOCP_DETECT_ENGINE_IDLE_TTL_MS:1800000}
      max-tenants: ${SOCP_DETECT_ENGINE_MAX_TENANTS:1000}
      cleanup-interval-ms: ${SOCP_DETECT_ENGINE_CLEANUP_INTERVAL_MS:60000}
    backpressure:
      # Count the in-flight, lane-queued and deferred payload bytes per Kafka
      # partition; one oversized record is admitted so a partition can drain.
      partition-max-bytes: ${SOCP_DETECT_PARTITION_MAX_PENDING_BYTES:16777216}
    tenant:
      # Zero rate means unlimited; byte/entity defaults remain finite and are
      # evaluated independently for every authenticated event tenant.
      max-events-per-second: ${SOCP_DETECT_TENANT_MAX_EVENTS_PER_SECOND:0}
      rate-burst: ${SOCP_DETECT_TENANT_RATE_BURST:100}
      max-pending-bytes: ${SOCP_DETECT_TENANT_MAX_PENDING_BYTES:67108864}
      max-active-entities: ${SOCP_DETECT_TENANT_MAX_ACTIVE_ENTITIES:100000}
      entity-idle-ttl-ms: ${SOCP_DETECT_TENANT_ENTITY_IDLE_TTL_MS:1800000}
    watchlists:
      # Shared database state is refreshed on this bounded interval so a
      # mutation made through another Detection instance becomes effective
      # without turning every inlist rule evaluation into a database query.
      refresh-ms: ${SOCP_DETECT_WATCHLIST_REFRESH_MS:1000}
      cache-max-entries: ${SOCP_DETECT_WATCHLIST_CACHE_MAX_ENTRIES:10000}
      cache-cleanup-interval-ms: ${SOCP_DETECT_WATCHLIST_CACHE_CLEANUP_INTERVAL_MS:60000}
    state:
      shards: ${SOCP_DETECT_STATE_SHARDS:1}
      owner-lease: ${SOCP_DETECT_STATE_OWNER_LEASE:30s}
      retention: ${SOCP_DETECT_STATE_RETENTION:24h}
      # Replay retention is separate from cleanup retention. Completed rows
      # support state rebuild; terminal DLQ rows are retained longer as failure
      # evidence and are never deleted on the replay clock.
      completed-retention: ${SOCP_DETECT_STATE_COMPLETED_RETENTION:7d}
      dead-letter-retention: ${SOCP_DETECT_STATE_DEAD_LETTER_RETENTION:90d}
      replay-page-size: ${SOCP_DETECT_STATE_REPLAY_PAGE_SIZE:1000}
      # Startup/rebalance prefetch is intentionally bounded. Rows beyond this
      # prefix keep their Kafka offsets uncommitted and are redelivered normally.
      replay-pending-max: ${SOCP_DETECT_STATE_REPLAY_PENDING_MAX:100}
      cleanup-batch-size: ${SOCP_DETECT_STATE_CLEANUP_BATCH_SIZE:1000}
      cleanup-max-batches: ${SOCP_DETECT_STATE_CLEANUP_MAX_BATCHES:10}
      cleanup-interval-ms: ${SOCP_DETECT_STATE_CLEANUP_INTERVAL_MS:600000}
      cleanup-initial-delay-ms: ${SOCP_DETECT_STATE_CLEANUP_INITIAL_DELAY_MS:600000}
    alert-outbox:
      # Polling is deliberately short; delivery is still bounded by the
      # database-backed outbox and its exponential retry schedule.
      poll-interval-ms: ${SOCP_DETECT_ALERT_OUTBOX_POLL_MS:1000}
      initial-delay-ms: ${SOCP_DETECT_ALERT_OUTBOX_INITIAL_DELAY_MS:1000}
      # Bound synchronous Alert Web calls per Detection instance. The verified
      # three-instance profile therefore offers at most six concurrent durable
      # deliveries without saturating the shared PostgreSQL instance.
      delivery-concurrency: ${SOCP_DETECT_ALERT_OUTBOX_CONCURRENCY:2}
      max-attempts: ${SOCP_DETECT_ALERT_OUTBOX_MAX_ATTEMPTS:12}
      retention-ms: ${SOCP_DETECT_ALERT_OUTBOX_RETENTION_MS:2592000000}
      max-drain-rounds: ${SOCP_DETECT_ALERT_OUTBOX_MAX_DRAIN_ROUNDS:64}
      max-drain-duration-ms: ${SOCP_DETECT_ALERT_OUTBOX_MAX_DRAIN_DURATION_MS:2000}
      cleanup-batch-size: ${SOCP_DETECT_ALERT_OUTBOX_CLEANUP_BATCH_SIZE:1000}
      cleanup-max-batches: ${SOCP_DETECT_ALERT_OUTBOX_CLEANUP_MAX_BATCHES:10}
      cleanup-interval-ms: ${SOCP_DETECT_ALERT_OUTBOX_CLEANUP_INTERVAL_MS:3600000}
      cleanup-initial-delay-ms: ${SOCP_DETECT_ALERT_OUTBOX_CLEANUP_INITIAL_DELAY_MS:60000}
    # Former detect-model capability. It now shares the Detection artifact,
    # but keeps its own bounded database/Flyway transaction boundary.
    model:
      analyzer-version: ${SOCP_DETECT_ANALYZER_VERSION:v1}
      retention: ${SOCP_DETECT_MODEL_RETENTION:30d}
      cleanup-interval-ms: ${SOCP_DETECT_MODEL_CLEANUP_INTERVAL_MS:3600000}
      cleanup-initial-delay-ms: ${SOCP_DETECT_MODEL_CLEANUP_INITIAL_DELAY_MS:60000}
      window-idle-ttl-ms: ${SOCP_DETECT_MODEL_WINDOW_IDLE_TTL_MS:1800000}
      window-max-tenants: ${SOCP_DETECT_MODEL_WINDOW_MAX_TENANTS:1000}
      window-max-dimensions: ${SOCP_DETECT_MODEL_WINDOW_MAX_DIMENSIONS:10000}
      rule-state-idle-ttl-ms: ${SOCP_DETECT_MODEL_RULE_STATE_IDLE_TTL_MS:1800000}
      rule-state-max-tenants: ${SOCP_DETECT_MODEL_RULE_STATE_MAX_TENANTS:1000}
      rule-state-cleanup-interval-ms: ${SOCP_DETECT_MODEL_RULE_STATE_CLEANUP_INTERVAL_MS:60000}
      datasource:
        url: jdbc:h2:file:${user.home}/.socp/detect-model;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: socp
        password: socp
        hikari:
          maximum-pool-size: ${SOCP_DETECT_MODEL_DB_POOL_MAX:2}
          minimum-idle: ${SOCP_DETECT_MODEL_DB_POOL_MIN:0}
      flyway:
        url: ${socp.detect.model.datasource.url}
        user: ${socp.detect.model.datasource.username}
        password: ${socp.detect.model.datasource.password}
  kafka:
    bootstrap: ${SOCP_KAFKA_BOOTSTRAP:localhost:9092}
    group-id: ${SOCP_KAFKA_GROUP_ID:socp-detect}
    alarm-topic: ${SOCP_KAFKA_ALARM_TOPIC:socp-alarm-original}
    enabled: ${SOCP_KAFKA_ENABLED:true}
    rule-outbox:
      max-attempts: ${SOCP_RULE_CHANGE_OUTBOX_MAX_ATTEMPTS:12}
      retention-ms: ${SOCP_RULE_CHANGE_OUTBOX_RETENTION_MS:2592000000}
      max-drain-rounds: ${SOCP_RULE_CHANGE_OUTBOX_MAX_DRAIN_ROUNDS:64}
      max-drain-duration-ms: ${SOCP_RULE_CHANGE_OUTBOX_MAX_DRAIN_DURATION_MS:2000}
      cleanup-batch-size: ${SOCP_RULE_CHANGE_OUTBOX_CLEANUP_BATCH_SIZE:1000}
      cleanup-max-batches: ${SOCP_RULE_CHANGE_OUTBOX_CLEANUP_MAX_BATCHES:10}
      cleanup-interval-ms: ${SOCP_RULE_CHANGE_OUTBOX_CLEANUP_INTERVAL_MS:3600000}
      cleanup-initial-delay-ms: ${SOCP_RULE_CHANGE_OUTBOX_CLEANUP_INITIAL_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,socpDependencies
