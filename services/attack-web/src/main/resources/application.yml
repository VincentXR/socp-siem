server:
  port: 18095
  servlet:
    context-path: /attack-web

spring:
  application:
    name: attack-web
  datasource:
    # 本地持久化（H2 文件库，替代内存态；重启不丢）。生产可换 PG（同 schema）。
    url: jdbc:h2:file:${user.home}/.socp/attack-web;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: socp
    password: socp
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true


socp:
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
