server:
  port: 18083
  servlet:
    context-path: /soar-web

spring:
  application:
    name: soar-web
  # 剧本持久化（2026-08-10）：H2 文件库 + Flyway，重启不丢；生产可切 PostgreSQL
  datasource:
    url: jdbc:h2:file:${user.home}/.socp/soar;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

socp:
  demo-data:
    enabled: ${SOCP_DEMO_DATA_ENABLED:true}
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
  temporal:
    # 双模式（2026-08-12）：Temporal 可达走 Workflow，不可达回退进程内执行器。
    enabled: ${SOCP_TEMPORAL_ENABLED:true}
    target: ${SOCP_TEMPORAL_TARGET:localhost:7233}
    namespace: default
  soar:
    maturity: preview
    # Local/integration dry-runs remain visibly SIMULATED; application-prod.yml disables them.
    simulation-enabled: ${SOCP_SOAR_SIMULATION_ENABLED:true}
    action-connectors:
      firewall-block-url: ${SOCP_SOAR_FIREWALL_BLOCK_URL:}
      network-isolation-url: ${SOCP_SOAR_NETWORK_ISOLATION_URL:}
      snapshot-url: ${SOCP_SOAR_SNAPSHOT_URL:}
      timeout-ms: ${SOCP_SOAR_CONNECTOR_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
