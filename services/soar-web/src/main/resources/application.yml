server:
  port: 18083
  servlet:
    context-path: /soar-web

spring:
  application:
    name: soar-web
  # 剧本持久化（2026-08-10）：H2 文件库 + Flyway，重启不丢；生产可切 PostgreSQL
  datasource:
    url: jdbc:h2:file:${user.home}/.socp/soar;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

socp:
  demo-data:
    enabled: ${SOCP_DEMO_DATA_ENABLED:true}
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
  temporal:
    # SOAR 语义（2026-09）：Temporal 不可达时只保留 durable backlog，不回退进程内副作用执行器。
    enabled: ${SOCP_TEMPORAL_ENABLED:true}
    target: ${SOCP_TEMPORAL_TARGET:localhost:7233}
    namespace: default
  soar:
    maturity: preview
    # Runtime switches. Empty tenant allow-list means every tenant.
    control-plane-enabled: ${SOCP_SOAR_CONTROL_PLANE_ENABLED:true}
    execution-enabled: ${SOCP_SOAR_EXECUTION_ENABLED:true}
    evaluation-enabled: ${SOCP_SOAR_EVALUATION_ENABLED:true}
    execution-tenant-allowlist: ${SOCP_SOAR_TENANT_ALLOWLIST:}
    # Every node must interpret a schedule in the same zone.
    schedule-zone: ${SOCP_SOAR_SCHEDULE_ZONE:UTC}
    # Local/integration dry-runs remain visibly SIMULATED; application-prod.yml disables them.
    simulation-enabled: ${SOCP_SOAR_SIMULATION_ENABLED:true}
    sse-enabled: ${SOCP_SOAR_SSE_ENABLED:true}
    sse-poll-interval-ms: ${SOCP_SOAR_SSE_POLL_INTERVAL_MS:500}
    sse-timeout-ms: ${SOCP_SOAR_SSE_TIMEOUT_MS:30000}
    sse-scheduler-threads: ${SOCP_SOAR_SSE_SCHEDULER_THREADS:2}
    secrets:
      # Preview keeps the env:// compatibility resolver. Production selects
      # the Kubernetes projected-volume provider (or Vault explicitly).
      backend: ${SOCP_SOAR_SECRET_BACKEND:env}
      kubernetes-mount-path: ${SOCP_SOAR_K8S_SECRET_MOUNT_PATH:/var/run/secrets/socp}
      vault-endpoint: ${SOCP_SOAR_VAULT_ENDPOINT:}
      vault-token-ref: ${SOCP_SOAR_VAULT_TOKEN_REF:}
      allow-insecure: ${SOCP_SOAR_SECRET_ALLOW_INSECURE:false}
      allow-environment-fallback: ${SOCP_SOAR_SECRET_ALLOW_ENV_FALLBACK:true}
      connect-timeout-ms: ${SOCP_SOAR_SECRET_CONNECT_TIMEOUT_MS:3000}
      request-timeout-ms: ${SOCP_SOAR_SECRET_REQUEST_TIMEOUT_MS:5000}
    artifacts:
      # Inline is a development-only compatibility backend. Production uses
      # the S3-compatible store below and rejects missing configuration.
      backend: ${SOCP_SOAR_ARTIFACT_BACKEND:inline}
      endpoint: ${SOCP_SOAR_ARTIFACT_S3_ENDPOINT:}
      region: ${SOCP_SOAR_ARTIFACT_S3_REGION:us-east-1}
      bucket: ${SOCP_SOAR_ARTIFACT_S3_BUCKET:}
      access-key-ref: ${SOCP_SOAR_ARTIFACT_S3_ACCESS_KEY_REF:env://SOCP_SOAR_ARTIFACT_S3_ACCESS_KEY}
      secret-key-ref: ${SOCP_SOAR_ARTIFACT_S3_SECRET_KEY_REF:env://SOCP_SOAR_ARTIFACT_S3_SECRET_KEY}
      path-style: ${SOCP_SOAR_ARTIFACT_S3_PATH_STYLE:true}
      allow-insecure: ${SOCP_SOAR_ARTIFACT_S3_ALLOW_INSECURE:false}
      connect-timeout-ms: ${SOCP_SOAR_ARTIFACT_S3_CONNECT_TIMEOUT_MS:3000}
      request-timeout-ms: ${SOCP_SOAR_ARTIFACT_S3_REQUEST_TIMEOUT_MS:15000}
    action-connectors:
      firewall-block-url: ${SOCP_SOAR_FIREWALL_BLOCK_URL:}
      network-isolation-url: ${SOCP_SOAR_NETWORK_ISOLATION_URL:}
      snapshot-url: ${SOCP_SOAR_SNAPSHOT_URL:}
      timeout-ms: ${SOCP_SOAR_CONNECTOR_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
