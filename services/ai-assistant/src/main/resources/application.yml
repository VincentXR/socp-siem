server:
  port: 18088
  servlet:
    context-path: /ai-assistant

spring:
  application:
    name: ai-assistant
  datasource:
    # 本地持久化（H2 文件库，替代内存态；重启不丢）。生产可换 PG（同 schema）。
    url: jdbc:h2:file:${user.home}/.socp/ai-assistant;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: socp
    password: socp
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true


socp:
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}
    metrics-token: ${SOCP_SECURITY_METRICS_TOKEN:socp-demo-metrics-token}
  ai:
    maturity: preview
    investigation:
      max-tool-calls: ${SOCP_AI_INVESTIGATION_MAX_TOOL_CALLS:6}
      max-evidence: ${SOCP_AI_INVESTIGATION_MAX_EVIDENCE:200}
      max-related-events: ${SOCP_AI_INVESTIGATION_MAX_RELATED_EVENTS:100}
      timeout-ms: ${SOCP_AI_INVESTIGATION_TIMEOUT_MS:15000}
    llm:
      enabled: ${SOCP_AI_LLM_ENABLED:false}
      base-url: ${SOCP_AI_LLM_BASE_URL:http://localhost:11434}
      allowed-hosts: ${SOCP_AI_LLM_ALLOWED_HOSTS:localhost}
      https-only: ${SOCP_AI_LLM_HTTPS_ONLY:false}
      allow-private-networks: ${SOCP_AI_LLM_ALLOW_PRIVATE_NETWORKS:true}
      api-key: ${SOCP_AI_LLM_API_KEY:}
      model: ${SOCP_AI_LLM_MODEL:qwen2.5:7b}
      timeout-ms: ${SOCP_AI_LLM_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
