server:
  port: 18085
  servlet:
    context-path: /asset-web

spring:
  application:
    name: asset-web
  # 资产持久化（2026-08-10）：H2 文件库 + Flyway，重启不丢；生产可切 PostgreSQL
  datasource:
    url: jdbc:h2:file:${user.home}/.socp/asset;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

socp:
  demo-data:
    enabled: ${SOCP_DEMO_DATA_ENABLED:true}
  security:
    # 生产鉴权（2026-08-09 启用）：HMAC HS256 验签，与网关 /auth/login 签发 secret 一致。
    jwt-secret: ${SOCP_JWT_SECRET:}
    issuer-uri: ${SOCP_SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SOCP_SECURITY_JWK_SET_URI:}
    audience: ${SOCP_SECURITY_AUDIENCE:socp-api}
    dev-bypass: ${SOCP_DEV_BYPASS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
