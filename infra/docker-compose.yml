# SOCP 基础设施（P0）——docker-compose 一键起全栈中间件
#
# 接线状态（2026-08-15）：
#   **已接线（真客户端）**：
#     - PostgreSQL：alert-web(库 alert) / threat-web(库 threat) / incident-web(库 incident)
#       / soc-base(库 audit)，均使用 Flyway 迁移；另 9 个服务默认 H2 文件库，
#       可通过 application-pg.yml 切换 PostgreSQL。
#     - Kafka：search-config producer → socp-events → detect-web consumer（Detection 主链，
#       acks=all + 幂等 + 手动 commit + eventId 去重 + DLQ）；socp-rule-changes 规则热更新广播。
#     - OpenSearch：search-config OsEventWriter（socp-events-yyyy.MM.dd 按天索引，HTTPS + basic）。
#     - ClickHouse：alert-web CkReporter（alert_agg.alarm_detail，report-web 报表聚合优先查 CK）。
#   **可选组件**：Redis（当前限流默认进程内）/ MinIO（对象存储扩展点）/
#     Temporal（SOAR 可用时走 Workflow）/ Keycloak（可选 OIDC 登录与 JWKS）。
#   **模式**：Local Dev 默认即「混合」——4 个 PostgreSQL + 9 个 H2 + 4 个无状态服务；
#   起本 compose 后中间件就绪，核心链路（Kafka/OS/CK）立即生效。
#  2) 本文件需要本机具备 **Docker 运行时**，并非所有开发环境都具备。
#     无 Docker 时仍可运行 H2/无状态服务；Kafka/OpenSearch/ClickHouse 等真实链路需要 Docker。
#  3) 生产/集成模式：把 9 个 H2 服务切 PostgreSQL（SOCP_PG_* 环境变量 + 建库），
#     并设置 SOCP_INGEST_FORWARD_HTTP / SOCP_TRACING_ENABLED 等开关，见 README「两种模式」。
#
# 其它说明：
#  - 镜像 tag 钉写稿时已知 GA；正式编码前请联网到官方源核验一次（见架构报告 §1 版本核验清单）。
#    已知可能偏旧：Temporal(建议升 1.24+)、Keycloak(建议 27/28)、ClickHouse(建议 26.x LTS)。
#  - PostgreSQL 的 Apache AGE 扩展需带 AGE 的镜像（如 bitnine/age:PG18 或自构建），
#    标准 postgres:18 不含 AGE；init-sql/02_age.sql 为可选，按需启用。
#  - 业务服务容器内 8080；宿主端口 18080~18097（17 个服务，见 build/run-all.sh 的 BACKENDS 数组）。
#  - 宿主端口冲突约定：避开 8080（旧 SIEM 控制台占用）；ClickHouse 原生口让位给 MinIO，见下。

networks:
  socp:
    driver: bridge

volumes:
  pg-data:
  os-data:
  redis-data:
  ck-data:
  minio-data:
  temporal-data:
  kafka-data:

# Compose's deploy limits are not enforced consistently by every local Docker
# runtime, so keep explicit per-service caps below as the local-dev guardrail.
x-socp-runtime: &socp-runtime
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── 关系库 + 图扩展点（当前业务关系与租户数据使用 PostgreSQL） ──
  # alert / incident / soc-base / threat 默认连接 PostgreSQL；其余可持久化服务
  # 默认使用文件 H2，并均由 Flyway 管理 schema。Apache AGE 为可选扩展，当前不承担主链路。
  postgres:
    <<: *socp-runtime
    image: postgres:18
    container_name: socp-postgres
    environment:
      POSTGRES_USER: socp
      POSTGRES_PASSWORD: socp
      POSTGRES_DB: socp
    ports:
      - "5432:5432"
    volumes:
      # PG18+ 数据目录约定变更：挂载父目录 /var/lib/postgresql（数据落在其子目录），
      # 挂 /var/lib/postgresql/data 会被容器判定为旧格式而拒绝启动。
      - pg-data:/var/lib/postgresql
      - ./init-sql/pg:/docker-entrypoint-initdb.d:ro
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 流式（KRaft，无 ZooKeeper） ─────────────────────────
  # search-config → socp-events → detect-web 是 canonical 事件主链；规则变更、审计与
  # alert Outbox 使用独立 topic。audit sink 仍可按配置选择 memory 或 Kafka。
  kafka:
    <<: *socp-runtime
    # bitnami 镜像已从 Docker Hub 撤出，改用 Apache 官方镜像（KRaft 单节点）
    image: apache/kafka:4.0.0
    container_name: socp-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # 宿主可达：advertised 用 localhost（search/detect 等业务服务跑在宿主机，连 localhost:9092）
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # 演示环境开 auto-create，避免容器重建后 topic 丢失需手动重建
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 增强（2026-08-10）：新建 topic 默认 3 分区（事件可并行消费、支持多消费者实例扩展）。
      # 副本因子保持 1（单 broker KRaft 演示环境；生产集群按 broker 数调整 replication.factor）。
      # Distributed correctness verification uses six partitions across three
      # Detection instances. Existing topics must be expanded explicitly;
      # Kafka never reduces a topic's partition count.
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9092:9092"
    volumes:
      # KRaft 日志目录持久化（apache/kafka 镜像默认 log.dirs）
      - kafka-data:/tmp/kraft-combined-logs
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 768M
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── 检索引擎（OpenSearch 2.19） ────────────────────────
  # OsIndexerConsumer 从 canonical Kafka 事件写入按天索引；检索 API 优先查 OpenSearch，
  # 不可用时按服务策略回退本地存储。
  opensearch:
    <<: *socp-runtime
    image: opensearchproject/opensearch:2.19.6
    container_name: socp-opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Socp!Sec2026xK"
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${SOCP_OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - os-data:/usr/share/opensearch/data
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 1024M
    mem_limit: 1024m
    healthcheck:
      # OS 2.x 默认启用 TLS，健康检查须走 https 且忽略自签证书
      test: ["CMD-SHELL", "curl -skfS -u \"admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    <<: *socp-runtime
    # 修正：镜像组织名为 opensearchproject（无连字符），与上方 opensearch 服务保持一致。
    # 原写法 opensearch-project/... 在 Docker Hub 不存在，会导致 pull 失败。
    image: opensearchproject/opensearch-dashboards:2.19.6
    container_name: socp-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      OPENSEARCH_DASHBOARDS_PASSWORD: "Socp@2026"
    ports:
      - "5601:5601"
    depends_on: [opensearch]
    networks: [socp]
    profiles: ["extra"]
    mem_limit: 512m

  # ── 缓存 / 分布式锁扩展点 ─────────────────────────────
  # 当前 socp-ratelimit 默认使用进程内令牌桶；Redis 已纳入编排，生产多实例部署应接入共享配额。
  redis:
    <<: *socp-runtime
    image: redis:8
    container_name: socp-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${SOCP_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 报表聚合（ClickHouse） ───────────────────────────
  # alert Outbox 事件由 AlarmEventConsumer 写入 alarm_detail；report-web 优先读取该聚合数据。
  clickhouse:
    <<: *socp-runtime
    image: clickhouse/clickhouse-server:25.3
    container_name: socp-clickhouse
    environment:
      # 25.x 镜像默认启用认证，显式固定密码（业务代码 socp.ck.url 使用）
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: socp
    ports:
      - "8123:8123"    # HTTP 接口
      # 端口冲突修正：原为 "9000:9000"，与 MinIO 的 S3 API 宿主端口 9000 冲突，
      # 会导致 `docker compose up` 直接失败。此处让位，宿主改用 9010（容器内仍是 9000）。
      # 原生 TCP 客户端连接串相应改为 localhost:9010。
      - "9010:9000"    # 原生 TCP 协议
    volumes:
      - ck-data:/var/lib/clickhouse
      - ./init-sql/clickhouse:/docker-entrypoint-initdb.d:ro
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 768M
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 对象存储扩展点（MinIO） ───────────────────────────
  # 当前用于本地基础设施预留；业务对象存储接入不是核心事件链路的一部分。
  minio:
    <<: *socp-runtime
    image: minio/minio:latest
    container_name: socp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: socp
      MINIO_ROOT_PASSWORD: Socp@2026
    ports:
      # MinIO 保留标准端口；ClickHouse 已让出宿主 9000（改为 9010），两者不再冲突。
      - "9000:9000"    # S3 API
      - "9001:9001"    # 控制台
    volumes:
      - minio-data:/data
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m

  # ── SOAR 编排引擎（Temporal Workflow + Activity） ─────
  # soar-web 可探测 Temporal：可达时使用 Workflow/Activity，不可达时回退本地执行器；
  # prod profile 禁止关闭 Temporal。该服务位于 extra profile，避免本地开发默认占用资源。
  temporal:
    <<: *socp-runtime
    image: temporalio/auto-setup:1.24.0
    container_name: socp-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: socp
      POSTGRES_PWD: socp
      POSTGRES_SEEDS: postgres
      # Temporal starts several internal services, each with its own SQL pool.
      # The image defaults (20/10) can consume ~70 of PostgreSQL's 100 local
      # connections and starve business services during full-stack startup.
      SQL_MAX_CONNS: 4
      SQL_MAX_IDLE_CONNS: 4
      SQL_VIS_MAX_CONNS: 2
      SQL_VIS_MAX_IDLE_CONNS: 2
    ports:
      - "7233:7233"
    depends_on: [postgres]
    networks: [socp]
    profiles: ["extra"]
    mem_limit: 768m

  temporal-ui:
    <<: *socp-runtime
    image: temporalio/ui:2.26.0
    container_name: socp-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    depends_on: [temporal]
    networks: [socp]
    profiles: ["extra"]
    mem_limit: 256m

  # ── 鉴权（可选 OIDC / JWKS） ───────────────────────────
  # Keycloak 通过 extra profile 提供 OIDC 登录；socp-auth 支持 JWKS 验签、exp/nbf/issuer
  # 校验和 @RequireRole。未注入真实配置的本地服务仍可使用显式开发回退，生产由 ProdGuard 拒绝。
  keycloak:
    <<: *socp-runtime
    image: quay.io/keycloak/keycloak:26.0
    container_name: socp-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Socp@2026
    ports:
      # 宿主端口修正：原为 8080，与旧 SIEM 控制台占用的 8080 冲突
      # （该控制台对任意路径返回 HTML，会造成健康检查假阳性）。
      # 改为宿主 8083，容器内保持 8080。控制台地址：http://localhost:8083
      - "8083:8080"
      - "8443:8443"
    volumes:
      - ./init-sql/keycloak:/opt/keycloak/data/import:ro
    networks: [socp]
    profiles: ["extra"]
    mem_limit: 768m

  # ── 可观测栈（Prometheus + Grafana + Loki + Jaeger，P18） ─
  # 🟡 部分就绪：micrometer-registry-prometheus 已是 17 个服务的依赖，但
  #    /actuator/prometheus **目前只有 api-gateway 暴露**；其余 16 个服务的
  #    management.endpoints.web.exposure.include 仅含 health,info
  #    （detect-web / search-config / alert-web 另含 metrics），抓取会 404 —— 属预期。
  #    开启方式：把 prometheus 加进各服务的 include 列表即可，无需改 prometheus.yml。
  #    代码中无 OpenTelemetry（根 pom 仅声明 micrometer-tracing-bridge-otel，各服务未引入）；
  #    架构图中提到的 OTel Collector 亦未纳入本编排，属规划项。
  prometheus:
    <<: *socp-runtime
    image: prom/prometheus:latest
    container_name: socp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./init-sql/prometheus:/etc/prometheus:ro
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m

  grafana:
    <<: *socp-runtime
    image: grafana/grafana:latest
    container_name: socp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: Socp@2026
    depends_on: [prometheus]
    networks: [socp]
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  # ── 可选服务（默认不启动）：docker compose --profile extra up -d ──
  loki:
    <<: *socp-runtime
    image: grafana/loki:latest
    container_name: socp-loki
    ports:
      - "3100:3100"
    networks: [socp]
    profiles: ["extra"]
    mem_limit: 512m

  jaeger:
    <<: *socp-runtime
    image: jaegertracing/all-in-one:latest
    container_name: socp-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    networks: [socp]
    profiles: ["extra"]
    mem_limit: 512m
