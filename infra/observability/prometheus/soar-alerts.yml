groups:
  - name: socp-soar
    rules:
      # runbook_url points each page at a disposal procedure. These rules live in
      # infra/observability/prometheus/ which is loaded by the deployment's
      # Prometheus rule_files (docs/operations/incident-response.md explains the
      # wiring and the fact that this baseline opt-in is off by default).
      - alert: SoarDispatchBacklogGrowing
        expr: soar_dispatch_backlog > 100
        for: 5m
        labels: {severity: warning, service: soar-web}
        annotations:
          summary: SOAR dispatch backlog is high
          description: Temporal or the dispatch worker may be unavailable; inspect queued runs before requeueing.
          runbook_url: docs/soar-runbook.md
      - alert: SoarSignalBacklogGrowing
        expr: soar_signal_backlog > 50
        for: 5m
        labels: {severity: warning, service: soar-web}
        annotations:
          summary: SOAR approval/manual signal backlog is high
          description: Check Temporal connectivity and signal worker errors.
          runbook_url: docs/soar-runbook.md
      - alert: SoarUnknownActionResults
        expr: increase(soar_action_unknown_total[15m]) > 0
        for: 1m
        labels: {severity: critical, service: soar-web}
        annotations:
          summary: SOAR action result is unknown
          description: Reconcile the remote system and resolve with evidence; do not blindly retry.
          runbook_url: docs/soar-runbook.md
