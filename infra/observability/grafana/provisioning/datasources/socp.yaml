# Prometheus datasource for the SOCP compose baseline.
# Mounted read-only into Grafana at
#   /etc/grafana/provisioning/datasources  (see docs/operations/incident-response.md
# for the compose mount lines). The bearer token is supplied by the deployment; this
# file only declares the datasource so dashboards stop being orphans with no uid.
apiVersion: 1
datasources:
  - name: SOCP-Prometheus
    uid: socp-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  - name: SOCP-Loki
    uid: socp-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '\[([a-f0-9]{32})\]'
          datasourceUid: socp-jaeger
          url: '$${__value.raw}'
  - name: SOCP-Jaeger
    uid: socp-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
