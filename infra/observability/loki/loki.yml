# Local, single-instance storage. Publish through an authenticated proxy in a
# managed deployment; do not expose this unauthenticated lab endpoint externally.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: socp_
        period: 24h
analytics:
  reporting_enabled: false
