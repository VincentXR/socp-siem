apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: socp-dev
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: detect-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: alert-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
images:
  - name: ghcr.io/vincentxr/socp-api-gateway
    newName: ghcr.io/vincentxr/socp-api-gateway
    digest: sha256:REPLACE_WITH_RELEASE_DIGEST
  - name: ghcr.io/vincentxr/socp-search-config
    newName: ghcr.io/vincentxr/socp-search-config
    digest: sha256:REPLACE_WITH_RELEASE_DIGEST
  - name: ghcr.io/vincentxr/socp-detect-web
    newName: ghcr.io/vincentxr/socp-detect-web
    digest: sha256:REPLACE_WITH_RELEASE_DIGEST
  - name: ghcr.io/vincentxr/socp-alert-web
    newName: ghcr.io/vincentxr/socp-alert-web
    digest: sha256:REPLACE_WITH_RELEASE_DIGEST
