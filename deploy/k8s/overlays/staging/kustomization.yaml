apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: socp-staging
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: detect-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: alert-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
