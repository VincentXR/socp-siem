apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-web
  namespace: socp-system
  labels: &alert-labels
    app.kubernetes.io/name: alert-web
    app.kubernetes.io/part-of: socp-siem
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *alert-labels
  template:
    metadata:
      labels: *alert-labels
    spec:
      serviceAccountName: socp-service
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-web
          image: ghcr.io/vincentxr/socp-alert-web@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: socp-runtime
            - secretRef:
                name: socp-runtime-secrets
          readinessProbe:
            httpGet:
              path: /alert-web/actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alert-web/actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /alert-web/actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: alert-web
  namespace: socp-system
spec:
  selector:
    app.kubernetes.io/name: alert-web
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alert-web
  namespace: socp-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-web
