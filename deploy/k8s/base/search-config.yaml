apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-config
  namespace: socp-system
  labels: &search-labels
    app.kubernetes.io/name: search-config
    app.kubernetes.io/part-of: socp-siem
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *search-labels
  template:
    metadata:
      labels: *search-labels
    spec:
      serviceAccountName: socp-service
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: search-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-config
          image: ghcr.io/vincentxr/socp-search-config@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: socp-runtime
            - secretRef:
                name: socp-runtime-secrets
          env:
            - name: SOCP_HEALTH_REQUIRED_ENDPOINTS
              value: kafka=kafka.socp-data.svc.cluster.local:9092,opensearch=opensearch.socp-data.svc.cluster.local:9200,detect=detect-web:8080
          readinessProbe:
            httpGet:
              path: /search-config/actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /search-config/actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /search-config/actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: search-config
  namespace: socp-system
spec:
  selector:
    app.kubernetes.io/name: search-config
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-config
  namespace: socp-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search-config
