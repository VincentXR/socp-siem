apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-default-deny
  namespace: socp-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-core-egress
  namespace: socp-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: socp-siem
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-gateway-ingress
  namespace: socp-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
