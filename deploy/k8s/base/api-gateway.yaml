apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: socp-system
  labels: &gateway-labels
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: socp-siem
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *gateway-labels
  template:
    metadata:
      labels: *gateway-labels
    spec:
      serviceAccountName: socp-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/vincentxr/socp-api-gateway@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: socp-runtime
            - secretRef:
                name: socp-runtime-secrets
          env:
            - name: SOCP_SECURITY_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: socp-runtime-secrets
                  key: security-issuer-uri
            - name: SOCP_SECURITY_JWK_SET_URI
              valueFrom:
                secretKeyRef:
                  name: socp-runtime-secrets
                  key: security-jwk-set-uri
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: socp-system
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: socp-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
