images:
  apiGateway:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  searchConfig:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  detectWeb:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  alertWeb:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  name: socp-service
  annotations: {}

runtime:
  existingSecret: socp-runtime-secrets
  config:
    # The pg profile is what points spring.datasource at PostgreSQL; without
    # it the prod profile keeps the H2 file database that ProdGuard rejects,
    # so the release could never start.
    SPRING_PROFILES_ACTIVE: "prod,pg"
    SERVER_PORT: "8080"
    SPRING_DATA_REDIS_HOST: redis.socp-data.svc.cluster.local
    SPRING_DATA_REDIS_PORT: "6379"
    SOCP_TENANT_RLS_ENABLED: "true"
    SOCP_SECURITY_REQUIRE_GATEWAY: "true"
    SOCP_ALLOW_GLOBAL_INGEST_TOKEN: "false"
    SOCP_OPENSEARCH_INSECURE_SKIP_VERIFY: "false"
    SOCP_AUTH_COOKIE_SECURE: "true"
    SOCP_RATELIMIT_BACKEND: redis
    SOCP_RATELIMIT_FAIL_CLOSED: "true"
    SOCP_AUDIT_SINK: kafka
    SOCP_AUDIT_FAIL_CLOSED: "true"
    SOCP_KAFKA_BOOTSTRAP: kafka.socp-data.svc.cluster.local:9092
    SOCP_PG_HOST: postgres.socp-data.svc.cluster.local
    SOCP_PG_PORT: "5432"
    SOCP_OPENSEARCH_URL: https://opensearch.socp-data.svc.cluster.local:9200
    SOCP_CK_URL: http://clickhouse.socp-data.svc.cluster.local:8123
    SOCP_SSA_URI: http://alert-web:8080
    SOCP_GLS_URI: http://search-config-api:8080
    SOCP_GAS_WEB_URI: http://detect-web-api:8080
    SOCP_GAS_WORKER_URI: http://detect-web-worker:8080
    SOCP_DETECT_URL: http://detect-web-api:8080
    SOCP_ALERT_URL: http://alert-web:8080
  extraConfig: {}

autoscaling:
  enabled: true
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  dependencyNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: socp-data
  gatewayIngressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  metricsIngressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  # An empty list is correct only while every dependency resolves inside the
  # cluster. The moment an environment-owned values file points runtime.config
  # or SOCP_HEALTH_REQUIRED_ENDPOINTS at a managed or external Kafka,
  # PostgreSQL, OpenSearch, ClickHouse, Redis, or identity endpoint, that file
  # must also add egress rules here. Without them the readiness probes fail,
  # and an --atomic rollout reverts the whole release after the timeout.
  additionalEgress: []

monitoring:
  # A PrometheusRule without metrics discovery evaluates against no data, so
  # verify-helm.py refuses any profile that enables the rule without the
  # ServiceMonitor. Both require the Prometheus Operator CRDs; enabling them
  # on a cluster without those CRDs makes `helm upgrade --atomic` fail and
  # roll back, so the chart keeps both off by default.
  prometheusRule:
    enabled: false
    # Extra labels so the rule can match the Prometheus Operator's
    # ruleSelector, typically `release: <prometheus-release-name>`.
    additionalLabels: {}
  serviceMonitor:
    enabled: false
    # Extra labels so the objects can match the Prometheus Operator's
    # serviceMonitorSelector, typically `release: <prometheus-release-name>`.
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s
    # Pulled from runtime.existingSecret. The platform authenticates it as
    # `Authorization: Bearer <token>` and restricts it to the actuator metrics
    # endpoints, so Prometheus needs no JWT and no gateway signature.
    bearerTokenSecretKey: SOCP_SECURITY_METRICS_TOKEN

workloads:
  api-gateway:
    image: apiGateway
    runtimeDomain: gateway-ui
    replicas: 2
    terminationGracePeriodSeconds: 30
    tmpSizeLimit: 256Mi
    health:
      basePath: /actuator/health
      # Intentionally no metricsPath. The Gateway exposes health only on the
      # application port; application.yml documents that Prometheus samples
      # must wait for a dedicated internal management path/port. Rendering a
      # ServiceMonitor for it would scrape an endpoint that does not exist.
    secretEnv: {}
    env: {}
    fieldEnv: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      minAvailable: 1
  search-config-api:
    image: searchConfig
    runtimeDomain: ingest-search
    replicas: 2
    terminationGracePeriodSeconds: 45
    tmpSizeLimit: 512Mi
    health:
      basePath: /search-config/actuator/health
      metricsPath: /search-config/actuator/prometheus
    secretEnv: {}
    fieldEnv: {}
    env:
      SOCP_SEARCH_RUNTIME_ROLE: api
      SOCP_HEALTH_REQUIRED_ENDPOINTS: kafka=kafka.socp-data.svc.cluster.local:9092,opensearch=opensearch.socp-data.svc.cluster.local:9200,detect=detect-web-api:8080
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
    podDisruptionBudget:
      minAvailable: 1
  search-config-worker:
    image: searchConfig
    runtimeDomain: ingest-search
    replicas: 2
    terminationGracePeriodSeconds: 45
    tmpSizeLimit: 512Mi
    health:
      basePath: /search-config/actuator/health
      metricsPath: /search-config/actuator/prometheus
    secretEnv: {}
    fieldEnv: {}
    env:
      SOCP_SEARCH_RUNTIME_ROLE: worker
      SOCP_HEALTH_REQUIRED_ENDPOINTS: kafka=kafka.socp-data.svc.cluster.local:9092,opensearch=opensearch.socp-data.svc.cluster.local:9200
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
    podDisruptionBudget:
      minAvailable: 1
  detect-web-api:
    image: detectWeb
    runtimeDomain: detection
    replicas: 2
    terminationGracePeriodSeconds: 45
    tmpSizeLimit: 512Mi
    health:
      basePath: /detect-web/actuator/health
      metricsPath: /detect-web/actuator/prometheus
    secretEnv: {}
    fieldEnv:
      SOCP_DETECT_INSTANCE_ID: metadata.uid
    env:
      SOCP_DETECT_RUNTIME_ROLE: api
      SOCP_HEALTH_REQUIRED_ENDPOINTS: kafka=kafka.socp-data.svc.cluster.local:9092,alert=alert-web:8080
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1024Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
    podDisruptionBudget:
      minAvailable: 1
  detect-web-worker:
    image: detectWeb
    runtimeDomain: detection
    replicas: 3
    terminationGracePeriodSeconds: 45
    tmpSizeLimit: 512Mi
    health:
      basePath: /detect-web/actuator/health
      metricsPath: /detect-web/actuator/prometheus
    secretEnv: {}
    fieldEnv:
      SOCP_DETECT_INSTANCE_ID: metadata.uid
    env:
      SOCP_DETECT_RUNTIME_ROLE: worker
      SOCP_KAFKA_GROUP_ID: socp-detect
      SOCP_HEALTH_REQUIRED_ENDPOINTS: kafka=kafka.socp-data.svc.cluster.local:9092,alert=alert-web:8080
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    autoscaling:
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65
    podDisruptionBudget:
      minAvailable: 2
  alert-web:
    image: alertWeb
    runtimeDomain: alert-incident
    replicas: 2
    terminationGracePeriodSeconds: 45
    tmpSizeLimit: 512Mi
    health:
      basePath: /alert-web/actuator/health
      metricsPath: /alert-web/actuator/prometheus
    secretEnv: {}
    fieldEnv: {}
    env:
      SOCP_HEALTH_REQUIRED_ENDPOINTS: kafka=kafka.socp-data.svc.cluster.local:9092,clickhouse=clickhouse.socp-data.svc.cluster.local:8123
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1024Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
    podDisruptionBudget:
      minAvailable: 1
