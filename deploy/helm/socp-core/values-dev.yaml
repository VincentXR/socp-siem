# The disposable dev reference environment does not run the Prometheus
# Operator, so both monitoring objects stay off and the intent is stated here
# rather than inherited from the chart defaults.
monitoring:
  prometheusRule:
    enabled: false
  serviceMonitor:
    enabled: false

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

workloads:
  api-gateway:
    replicas: 1
  search-config-api:
    replicas: 1
  search-config-worker:
    replicas: 1
  detect-web-api:
    replicas: 1
  detect-web-worker:
    replicas: 1
  alert-web:
    replicas: 1
