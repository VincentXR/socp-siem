{{- if .Values.autoscaling.enabled }}
{{- $root := . }}
{{- range $name, $workload := .Values.workloads }}
{{- if and (eq $name "detect-web-worker") (gt (int $workload.autoscaling.maxReplicas) (int $root.Values.runtime.detectionPartitions)) }}
{{- fail "detect-web-worker maxReplicas exceeds runtime.detectionPartitions; verify existing topic ownership before raising the bound" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "socp-core.commonLabels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $workload.autoscaling.minReplicas }}
  maxReplicas: {{ $workload.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: {{ $root.Values.autoscaling.scaleDownStabilizationSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $workload.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
