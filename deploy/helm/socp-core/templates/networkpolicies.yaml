{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socp-core.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-core-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socp-core.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: socp-siem
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: socp-siem
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dependencyNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8123
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-service-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socp-core.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: socp-siem
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: socp-siem
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-metrics-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socp-core.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: socp-siem
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsIngressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socp-gateway-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socp-core.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.gatewayIngressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
