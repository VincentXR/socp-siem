# Full SOC product profile layered on values-production.yaml. The default
# chart intentionally remains the six-workload event-path core; this profile
# adds every gateway-advertised domain so the Workbench cannot expose routes
# that have no production workload behind them.

images:
  soarWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  reportWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  assetWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  socBase: { repository: "", digest: "", pullPolicy: IfNotPresent }
  hipsWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  aiAssistant: { repository: "", digest: "", pullPolicy: IfNotPresent }
  threatWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  attackWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  notifyWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }
  incidentWeb: { repository: "", digest: "", pullPolicy: IfNotPresent }

runtime:
  config:
    SOCP_SOAR_URI: http://soar-web:8080
    SOCP_SFM_URI: http://report-web:8080
    SOCP_SAM_WEB_URI: http://asset-web:8080
    SOCP_SAM_COLLECT_URI: http://asset-web:8080
    SOCP_SOC_URI: http://soc-base:8080
    SOCP_HIPS_WEB_URI: http://hips-web:8080
    SOCP_HIPS_COLLECT_URI: http://hips-web:8080
    SOCP_AI_URI: http://ai-assistant:8080
    SOCP_TI_URI: http://threat-web:8080
    SOCP_ATTACK_URI: http://attack-web:8080
    SOCP_NOTIFY_URI: http://notify-web:8080
    SOCP_CASE_URI: http://incident-web:8080
    SOCP_SOAR_URL: http://soar-web:8080
    SOCP_REPORT_URL: http://report-web:8080
    SOCP_ASSET_URL: http://asset-web:8080
    SOCP_SOC_URL: http://soc-base:8080
    SOCP_HIPS_URL: http://hips-web:8080
    SOCP_AI_URL: http://ai-assistant:8080
    SOCP_THREAT_URL: http://threat-web:8080
    SOCP_ATTACK_URL: http://attack-web:8080
    SOCP_NOTIFY_URL: http://notify-web:8080
    SOCP_CASE_URL: http://incident-web:8080
    SOCP_INCIDENT_URL: http://incident-web:8080

x-product-platform-secrets: &product-platform-secrets
  SOCP_SECURITY_SERVICE_SECRET: SOCP_SECURITY_SERVICE_SECRET
  SOCP_SECURITY_METRICS_TOKEN: SOCP_SECURITY_METRICS_TOKEN
  SPRING_DATA_REDIS_PASSWORD: SPRING_DATA_REDIS_PASSWORD

x-product-workload: &product-workload
  replicas: 2
  terminationGracePeriodSeconds: 45
  tmpSizeLimit: 512Mi
  secretEnv: &database-secrets
    <<: *product-platform-secrets
    SOCP_PG_MIGRATION_PASSWORD: SOCP_PG_MIGRATION_PASSWORD
    SOCP_PG_MIGRATION_USER: SOCP_PG_MIGRATION_USER
    SOCP_PG_PASSWORD: SOCP_PG_PASSWORD
    SOCP_PG_USER: SOCP_PG_USER
  fieldEnv: {}
  env: {}
  resources: &standard-resources
    requests: { cpu: 150m, memory: 384Mi }
    limits: { cpu: "1", memory: 1024Mi }
  autoscaling: &standard-autoscaling
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget: &standard-pdb
    minAvailable: 1

workloads:
  alert-web:
    env:
      SOCP_ALARM_DELIVERY_DESTINATIONS: CLICKHOUSE,NOTIFY,INCIDENT,SOAR
      SOCP_ALERT_ENRICHMENT_ENABLED: "true"
      SOCP_HEALTH_REQUIRED_ENDPOINTS: kafka=kafka.socp-data.svc.cluster.local:9092,clickhouse=clickhouse.socp-data.svc.cluster.local:8123,notify=notify-web:8080,incident=incident-web:8080,soar=soar-web:8080
  soar-web:
    <<: *product-workload
    image: soarWeb
    runtimeDomain: response
    secretName: socp-soar-web-secrets
    health: { basePath: /soar-web/actuator/health, metricsPath: /soar-web/actuator/prometheus }
    env:
      SOCP_TEMPORAL_ENABLED: "true"
      SOCP_TEMPORAL_TARGET: temporal.socp-data.svc.cluster.local:7233
      SOCP_SOAR_SIMULATION_ENABLED: "false"
      SOCP_SOAR_SECRET_BACKEND: kubernetes
      SOCP_SOAR_SECRET_ALLOW_ENV_FALLBACK: "false"
      # Exact tenant-to-secret-reference grants; no implicit namespace access.
      SOAR_SECRET_TENANT_GRANTS: "{}"
      SOCP_SOAR_ARTIFACT_BACKEND: s3
      SOCP_SOAR_ARTIFACT_S3_ENDPOINT: https://minio.socp-data.svc.cluster.local:9000
      SOCP_SOAR_ARTIFACT_S3_BUCKET: socp-soar-artifacts
      SOCP_SOAR_ARTIFACT_S3_ALLOW_INSECURE: "false"
      SOCP_HEALTH_REQUIRED_ENDPOINTS: temporal=temporal.socp-data.svc.cluster.local:7233,minio=minio.socp-data.svc.cluster.local:9000
    secretVolume:
      secretName: socp-soar-secrets
      mountPath: /var/run/secrets/socp
      items:
        - { key: SOCP_SOAR_ARTIFACT_S3_ACCESS_KEY, path: platform/soar-artifacts/access-key }
        - { key: SOCP_SOAR_ARTIFACT_S3_SECRET_KEY, path: platform/soar-artifacts/secret-key }
  report-web:
    <<: *product-workload
    image: reportWeb
    runtimeDomain: reporting
    secretName: socp-report-web-secrets
    secretEnv:
      <<: *database-secrets
      SOCP_CK_USER: SOCP_CK_USER
      SOCP_CK_PASSWORD: SOCP_CK_PASSWORD
      SOCP_MINIO_ACCESS: SOCP_MINIO_ACCESS
      SOCP_MINIO_SECRET: SOCP_MINIO_SECRET
    env:
      SOCP_MINIO_URL: https://minio.socp-data.svc.cluster.local:9000
      SOCP_MINIO_BUCKET: socp-reports
      SOCP_MINIO_ENABLED: "true"
    health: { basePath: /report-web/actuator/health, metricsPath: /report-web/actuator/prometheus }
  asset-web:
    <<: *product-workload
    image: assetWeb
    runtimeDomain: context
    secretName: socp-asset-web-secrets
    health: { basePath: /asset-web/actuator/health, metricsPath: /asset-web/actuator/prometheus }
  soc-base:
    <<: *product-workload
    image: socBase
    runtimeDomain: context
    secretName: socp-soc-base-secrets
    health: { basePath: /soc-base/actuator/health, metricsPath: /soc-base/actuator/prometheus }
  hips-web:
    <<: *product-workload
    image: hipsWeb
    runtimeDomain: endpoint
    secretName: socp-hips-web-secrets
    secretEnv:
      <<: *database-secrets
      SOCP_COLLECTOR_CREDENTIALS: SOCP_COLLECTOR_CREDENTIALS
      SOCP_INGEST_TOKEN: SOCP_INGEST_TOKEN
    health: { basePath: /hips-web/actuator/health, metricsPath: /hips-web/actuator/prometheus }
  ai-assistant:
    <<: *product-workload
    image: aiAssistant
    runtimeDomain: investigation
    secretName: socp-ai-assistant-secrets
    health: { basePath: /ai-assistant/actuator/health, metricsPath: /ai-assistant/actuator/prometheus }
  threat-web:
    <<: *product-workload
    image: threatWeb
    runtimeDomain: enrichment
    secretName: socp-threat-web-secrets
    health: { basePath: /threat-web/actuator/health, metricsPath: /threat-web/actuator/prometheus }
  attack-web:
    <<: *product-workload
    image: attackWeb
    runtimeDomain: enrichment
    secretName: socp-attack-web-secrets
    health: { basePath: /attack-web/actuator/health, metricsPath: /attack-web/actuator/prometheus }
  notify-web:
    <<: *product-workload
    image: notifyWeb
    runtimeDomain: response
    secretName: socp-notify-web-secrets
    health: { basePath: /notify-web/actuator/health, metricsPath: /notify-web/actuator/prometheus }
  incident-web:
    <<: *product-workload
    image: incidentWeb
    runtimeDomain: alert-incident
    secretName: socp-incident-web-secrets
    health: { basePath: /incident-web/actuator/health, metricsPath: /incident-web/actuator/prometheus }
