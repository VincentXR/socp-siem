name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

env:
  # Avoid depending on third-party mirror synchronization in hosted CI.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  java-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Java artifacts
        run: bash build/mvnw.sh package -DskipTests

      - name: Restore OWASP vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/dependency-check
          key: dependency-check-${{ runner.os }}-v12-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-v12-

      - name: Scan Java dependency CVEs
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            org.owasp:dependency-check-maven:12.2.2:aggregate
            -DskipTestScope=true
            -DfailBuildOnCVSS=8
            -Dformat=HTML
            -DdataDirectory=.cache/dependency-check
            -DsuppressionFile=config/dependency-check-suppressions.xml
          )
          if [[ -n "${NVD_API_KEY}" ]]; then
            args+=("-DnvdApiKey=${NVD_API_KEY}" -DnvdApiDelay=3500)
          else
            args+=(-DnvdApiDelay=6000)
          fi
          bash build/mvnw.sh "${args[@]}"

      - name: Upload Java dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry=https://registry.npmjs.org --audit-level high
