name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

env:
  # Avoid depending on third-party mirror synchronization in hosted CI.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  java-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Java artifacts
        run: bash build/mvnw.sh package -DskipTests

      - name: Restore OWASP vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/dependency-check
          key: dependency-check-${{ runner.os }}-v12-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-v12-

      - name: Scan Java dependency CVEs
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            org.owasp:dependency-check-maven:12.2.2:aggregate
            -DskipTestScope=true
            -DfailBuildOnCVSS=8
            -Dformat=HTML
            -DdataDirectory=.cache/dependency-check
            -DsuppressionFile=config/dependency-check-suppressions.xml
          )
          if [[ -n "${NVD_API_KEY}" ]]; then
            args+=("-DnvdApiKey=${NVD_API_KEY}" -DnvdApiDelay=3500)
          else
            args+=(-DnvdApiDelay=6000)
          fi
          bash build/mvnw.sh "${args[@]}"

      - name: Upload Java dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry=https://registry.npmjs.org --audit-level high
