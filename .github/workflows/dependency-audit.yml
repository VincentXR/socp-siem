name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

env:
  # Avoid depending on third-party mirror synchronization in hosted CI.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Java artifacts
        run: bash build/mvnw.sh package -DskipTests

      - name: Scan Java dependency CVEs
        run: >-
          bash build/mvnw.sh org.owasp:dependency-check-maven:12.2.2:aggregate
          -DskipTestScope=true -DfailBuildOnCVSS=8 -Dformat=HTML
          -DnvdApiDelay=6000

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry=https://registry.npmjs.org --audit-level high

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
