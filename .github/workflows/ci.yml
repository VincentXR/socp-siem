name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  # GitHub-hosted runners should use Maven Central directly. The repository
  # mirror remains the default for local development in mainland China.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOCP_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_TESTCONTAINERS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm (matches package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Build backend (Maven reactor)
        run: bash build/mvnw.sh -DskipTests package

      - name: Run backend tests with coverage
        run: bash build/mvnw.sh test -Pcoverage -Dsurefire.failIfNoSpecifiedTests=false

      - name: Enforce coverage floor
        env:
          SOCP_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 build/verify-coverage.py
          python3 build/verify-changed-coverage.py

      - name: Verify migrations and deployment contracts
        run: |
          python3 build/verify-migrations.py
          python3 build/verify-contracts.py
          python3 build/verify-package-layout.py
          python3 build/verify-architecture.py
          python3 build/verify-style.py
          python3 build/verify-runtime-consolidation.py
          python3 build/verify-middleware-images.py
          python3 -m unittest discover -s build/tests -p 'test_*.py'
          python3 build/verify-frontend-i18n.py
          python3 build/verify-production.py

      - name: Verify Terraform contracts
        run: |
          terraform fmt -check -recursive deploy/terraform
          terraform -chdir=deploy/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=deploy/terraform/bootstrap validate
          terraform -chdir=deploy/terraform/bootstrap test
          terraform -chdir=deploy/terraform/environments/dev init -backend=false -input=false
          terraform -chdir=deploy/terraform/environments/dev validate
          terraform -chdir=deploy/terraform/environments/dev test

      - name: Run build policy and SpotBugs
        run: bash build/mvnw.sh verify -Pquality -DskipTests

      - name: Validate versioned detection content
        run: |
          python3 build/verify-event-schema.py
          python3 build/validate-detection-content.py
          mkdir -p .cache/evidence
          python3 build/generate-detection-summary.py --check-readme --json .cache/evidence/detection-summary.json
          python3 build/verify-investigation-dataset.py
          python3 build/eval-investigation.py \
            --results services/ai-assistant/target/investigation-eval-results.json

      - name: Collect commit-scoped validation evidence
        if: always()
        run: python3 build/collect-evidence.py --output .cache/evidence

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: .cache/evidence/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Install frontend deps (pnpm frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Verify generated SOAR OpenAPI SDK
        run: python3 build/verify-openapi-sdk.py --output .cache/evidence/openapi-sdk

      - name: Upload OpenAPI SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soar-openapi-sdk-evidence
          path: .cache/evidence/openapi-sdk/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Test frontend API contracts
        run: pnpm test
        working-directory: frontend/apps/workbench

      - name: Lint frontend sources
        run: pnpm lint
        working-directory: frontend/apps/workbench

      - name: Check frontend formatting
        run: pnpm format:check
        working-directory: frontend/apps/workbench

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/apps/workbench

      - name: Run workbench browser flows
        run: pnpm test:e2e
        working-directory: frontend/apps/workbench

      - name: Upload workbench browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-playwright-report
          path: |
            frontend/apps/workbench/playwright-report/
            frontend/apps/workbench/test-results/
          if-no-files-found: ignore

      - name: Verify frontend (typecheck, build, and artifact)
        run: pnpm verify
        working-directory: frontend/apps/workbench

      - name: Package backend JARs for E2E jobs
        run: |
          tar -czf backend-slice-jars.tgz \
            services/alert-web/target/alert-web-1.0.0-SNAPSHOT.jar \
            services/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar
          tar -czf backend-pipeline-extra-jars.tgz \
            services/search-config/target/search-config-1.0.0-SNAPSHOT.jar \
            services/detect-web/target/detect-web-1.0.0-SNAPSHOT.jar \
            services/report-web/target/report-web-1.0.0-SNAPSHOT.jar

      - name: Upload minimal-slice backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-slice-jars
          path: backend-slice-jars.tgz

      - name: Upload pipeline-only backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-pipeline-extra-jars
          path: backend-pipeline-extra-jars.tgz

  integration:
    name: Middleware integration contracts
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      SOCP_TESTCONTAINERS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run real middleware contracts
        run: >-
          bash build/mvnw.sh
          -pl platform/socp-test,platform/socp-tenant,services/api-gateway,services/incident-web,services/search-config,services/alert-web,services/detect-web,services/soar-web
          -am test
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=MiddlewareSemanticsContainerTest,ContainerIdempotencyContractTest,TenantRlsPostgresTest,ProductionDatabaseRoleGuardPostgresTest,RedisTokenRevocationStoreContainerTest,CaseTimelinePostgresTest,DetectionSnapshotPostgresConcurrencyTest,AlarmEnrichmentPostgresConcurrencyTest,OsEventReaderOpenSearchContainerTest,OsIndexerFailureContainerTest,SoarPostgresMigrationContractTest,SoarWorkflowLinearTest,SoarWorkflowFanOutTest,SoarWorkflowHumanGateTest,SoarWorkflowPrimitiveTest,SoarWorkflowSwitchTest

      - name: Upload middleware test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: middleware-integration-reports
          path: |
            platform/socp-test/target/surefire-reports/
            platform/socp-tenant/target/surefire-reports/
            services/incident-web/target/surefire-reports/
            services/alert-web/target/surefire-reports/
            services/search-config/target/surefire-reports/
            services/soar-web/target/surefire-reports/
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject newly introduced high-severity vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      SOCP_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_PG_BOOTSTRAP_PASSWORD: ci-e2e-pg-admin-password-0123456789abcdef
      SOCP_PG_USER: socp_runtime
      SOCP_PG_PASSWORD: ci-e2e-pg-runtime-password-0123456789abcdef
      SOCP_PG_RUNTIME_USER: socp_runtime
      SOCP_PG_RUNTIME_PASSWORD: ci-e2e-pg-runtime-password-0123456789abcdef
      SOCP_PG_MIGRATION_USER: socp_migrator
      SOCP_PG_MIGRATION_PASSWORD: ci-e2e-pg-migration-password-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Start E2E middleware from the image catalog
        run: bash build/compose.sh up -d --wait postgres redis

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download backend JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-slice-jars
          path: .

      - name: Extract backend JARs
        run: tar -xzf backend-slice-jars.tgz

      - name: Prepare PostgreSQL databases
        run: |
          pg_container="$(bash build/compose.sh ps -q postgres)"
          test -n "$pg_container"
          docker cp infra/init-sql/pg/00_roles.sh "$pg_container:/tmp/00_roles.sh"
          docker cp infra/init-sql/pg/02_runtime_grants.sh "$pg_container:/tmp/02_runtime_grants.sh"
          docker exec \
            -e POSTGRES_USER=socp \
            -e POSTGRES_DB=socp \
            -e SOCP_PG_RUNTIME_USER="$SOCP_PG_RUNTIME_USER" \
            -e SOCP_PG_RUNTIME_PASSWORD="$SOCP_PG_RUNTIME_PASSWORD" \
            -e SOCP_PG_MIGRATION_USER="$SOCP_PG_MIGRATION_USER" \
            -e SOCP_PG_MIGRATION_PASSWORD="$SOCP_PG_MIGRATION_PASSWORD" \
            "$pg_container" bash /tmp/00_roles.sh
          # The grants script deliberately covers every application database;
          # create the same registry used by the Compose init scripts before
          # applying it so the role/RLS contract is exercised end to end.
          for database in soc asset alert search detect hips soar report audit ai platform incident threat attack notify detect_model; do
            exists="$(docker exec "$pg_container" psql -U socp -d socp -Atqc "SELECT 1 FROM pg_database WHERE datname = '$database'")"
            if [ "$exists" != "1" ]; then
              docker exec "$pg_container" createdb -U socp "$database"
            fi
          done
          docker exec \
            -e POSTGRES_USER=socp \
            -e SOCP_PG_RUNTIME_USER="$SOCP_PG_RUNTIME_USER" \
            -e SOCP_PG_MIGRATION_USER="$SOCP_PG_MIGRATION_USER" \
            "$pg_container" bash /tmp/02_runtime_grants.sh

      - name: Start minimal slice (alert-web + gateway)
        run: |
          mkdir -p .cache
          # CI deliberately exercises the PostgreSQL-backed slice. Local
          # development uses the same profile so slice checks exercise claim
          # and transaction semantics close to the deployed path.
          SOCP_RUNTIME_PROFILES=pg bash build/run-slice.sh start || true
          python3 - <<'EOF'
          import time
          import urllib.request

          for _ in range(60):
              ok = 0
              # The minimal slice intentionally omits Kafka and ClickHouse.
              # Check liveness here so optional dependency readiness does not
              # turn a successfully started process into a false CI failure.
              for port, path in [(18092, "/actuator/health/liveness"),
                                 (18080, "/alert-web/actuator/health/liveness")]:
                  try:
                      if urllib.request.urlopen(f"http://127.0.0.1:{port}{path}", timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == 2:
                  print("slice UP")
                  break
              time.sleep(3)
          else:
              raise SystemExit("slice not up")
          EOF

      - name: Print slice logs on startup failure
        if: failure()
        run: |
          for log in .cache/*.log; do
            echo "===== $log ====="
            tail -n 160 "$log" || true
          done

      - name: Run slice E2E (auth/tenant/audit/ratelimit/trace)
        run: python3 build/verify-slice.py

      - name: Upload slice logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-e2e-logs
          path: .cache/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop E2E middleware
        if: always()
        run: bash build/compose.sh down -v

  e2e-pipeline:
    runs-on: ubuntu-latest
    needs: build
    env:
      SOCP_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_LOGIN_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_SECURITY_SERVICE_SECRET: ci-test-service-secret-0123456789abcdef
      SOCP_SECURITY_METRICS_TOKEN: ci-test-metrics-token-0123456789abcdef
      SOCP_SECURITY_ALLOW_PROD_HMAC: "true"
      SOCP_PG_BOOTSTRAP_PASSWORD: ci-test-pg-admin-password-0123456789abcdef
      SOCP_PG_USER: socp_runtime
      SOCP_PG_PASSWORD: ci-test-pg-runtime-password-0123456789abcdef
      SOCP_PG_RUNTIME_USER: socp_runtime
      SOCP_PG_RUNTIME_PASSWORD: ci-test-pg-runtime-password-0123456789abcdef
      SOCP_PG_MIGRATION_USER: socp_migrator
      SOCP_PG_MIGRATION_PASSWORD: ci-test-pg-migration-password-0123456789abcdef
      SOCP_CK_PASSWORD: ci-test-ck-password-0123456789abcdef
      SOCP_MINIO_SECRET: ci-test-minio-secret-0123456789abcdef
      SOCP_AUTH_USERS: '{"admin":"admin123","demo":"demo123","viewer":"viewer123"}'
      SOCP_AUTH_ROLES: '{"admin":"admin","demo":"analyst","viewer":"viewer"}'
      SOCP_COLLECTOR_CREDENTIALS: "ci-chaos|default|ci-chaos-collector-secret"
      SOCP_ALLOW_GLOBAL_INGEST_TOKEN: "false"
      SOCP_RUNTIME_PROFILES: pg
      SOCP_OPENSEARCH_DISABLE_SECURITY_PLUGIN: "true"
      PIPELINE_INGEST_URL: http://127.0.0.1:18081/search-config/api/v1/ingest
      PIPELINE_COLLECTOR_ID: ci-chaos
      PIPELINE_COLLECTOR_TOKEN: ci-chaos-collector-secret
      SOCP_OPENSEARCH_URL: http://localhost:9200
      SOCP_OPENSEARCH_USERNAME: admin
      SOCP_OPENSEARCH_PASSWORD: admin
      # CI middleware uses local HTTP OpenSearch and the configured ClickHouse credentials.
      PIPELINE_OS: http://localhost:9200
      PIPELINE_OS_AUTH: "admin:"
      PIPELINE_CK: http://localhost:8123
      PIPELINE_CK_AUTH: "default:ci-test-ck-password-0123456789abcdef"
      PIPELINE_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - name: Start pipeline middleware from the image catalog
        run: bash build/compose.sh up -d --wait postgres redis kafka opensearch clickhouse

      - name: Prepare PostgreSQL databases
        run: |
          pg_container="$(bash build/compose.sh ps -q postgres)"
          test -n "$pg_container"
          docker cp infra/init-sql/pg/00_roles.sh "$pg_container:/tmp/00_roles.sh"
          docker cp infra/init-sql/pg/02_runtime_grants.sh "$pg_container:/tmp/02_runtime_grants.sh"
          docker exec \
            -e POSTGRES_USER=socp \
            -e POSTGRES_DB=socp \
            -e SOCP_PG_RUNTIME_USER="$SOCP_PG_RUNTIME_USER" \
            -e SOCP_PG_RUNTIME_PASSWORD="$SOCP_PG_RUNTIME_PASSWORD" \
            -e SOCP_PG_MIGRATION_USER="$SOCP_PG_MIGRATION_USER" \
            -e SOCP_PG_MIGRATION_PASSWORD="$SOCP_PG_MIGRATION_PASSWORD" \
            "$pg_container" bash /tmp/00_roles.sh
          for database in soc asset alert search detect hips soar report audit ai platform incident threat attack notify detect_model; do
            exists="$(docker exec "$pg_container" psql -U socp -d socp -Atqc "SELECT 1 FROM pg_database WHERE datname = '$database'")"
            if [ "$exists" != "1" ]; then
              docker exec "$pg_container" createdb -U socp "$database"
            fi
          done
          docker exec \
            -e POSTGRES_USER=socp \
            -e SOCP_PG_RUNTIME_USER="$SOCP_PG_RUNTIME_USER" \
            -e SOCP_PG_MIGRATION_USER="$SOCP_PG_MIGRATION_USER" \
            "$pg_container" bash /tmp/02_runtime_grants.sh

      - name: Prepare ClickHouse schema
        run: |
          ck_container="$(bash build/compose.sh ps -q clickhouse)"
          test -n "$ck_container"
          docker exec -i "$ck_container" clickhouse-client \
            --user default --password "$SOCP_CK_PASSWORD" --multiquery \
            < infra/init-sql/clickhouse/init.sql

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download backend JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-slice-jars
          path: .

      - name: Download pipeline-only backend JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-pipeline-extra-jars
          path: .

      - name: Extract backend JARs
        run: |
          tar -xzf backend-slice-jars.tgz
          tar -xzf backend-pipeline-extra-jars.tgz

      - name: Install kafka-python (pipeline probe)
        run: pip install kafka-python==3.0.10

      - name: Boot core JARs with production-like contexts
        env:
          SOCP_AUTH_COOKIE_SECURE: "true"
          SOCP_RATELIMIT_BACKEND: redis
          SOCP_RATELIMIT_FAIL_CLOSED: "true"
          SOCP_AUDIT_SINK: kafka
          SOCP_AUDIT_FAIL_CLOSED: "true"
          SOCP_TENANT_RLS_ENABLED: "true"
          SOCP_OPENSEARCH_ENABLED: "false"
          SOCP_OPENSEARCH_USERNAME: ci-prod-smoke
          SOCP_OPENSEARCH_PASSWORD: ci-prod-smoke-password-0123456789abcdef
          SOCP_OPENSEARCH_INSECURE_SKIP_VERIFY: "false"
          SOCP_MINIO_ENABLED: "false"
          SOCP_INGEST_TOKEN: ci-chaos-collector-secret
          SOCP_VECTOR_TOKEN: ci-chaos-collector-secret
        run: >-
          python3 build/verify-prod-boot.py --services
          search-config detect-web alert-web report-web api-gateway

      - name: Start pipeline services
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache"
          export SOCP_OPENSEARCH_URL=http://localhost:9200
          export SOCP_OPENSEARCH_USERNAME=admin
          export SOCP_OPENSEARCH_PASSWORD=admin
          # Keep the pipeline E2E on the same PostgreSQL-backed profile used by
          # the Docker services. The gateway also needs dev for demo accounts.
          nohup java -jar services/search-config/target/search-config-1.0.0-SNAPSHOT.jar --server.port=18081 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/search-config.log" 2>&1 &
          nohup java -jar services/detect-web/target/detect-web-1.0.0-SNAPSHOT.jar --server.port=18082 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/detect-web.log" 2>&1 &
          nohup java -jar services/alert-web/target/alert-web-1.0.0-SNAPSHOT.jar --server.port=18080 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/alert-web.log" 2>&1 &
          nohup java -jar services/report-web/target/report-web-1.0.0-SNAPSHOT.jar --server.port=18084 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/report-web.log" 2>&1 &
          nohup java -jar services/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar --server.port=18092 --spring.profiles.active=dev,pg > "$GITHUB_WORKSPACE/.cache/api-gateway.log" 2>&1 &
          python3 - <<'EOF'
          import time
          import urllib.request

          targets = [
              (18081, "/search-config/actuator/health"),
              (18082, "/detect-web/actuator/health"),
              (18080, "/alert-web/actuator/health"),
              (18084, "/report-web/actuator/health"),
              (18092, "/actuator/health"),
          ]
          for _ in range(90):
              ok = 0
              for port, path in targets:
                  try:
                      if urllib.request.urlopen(f"http://127.0.0.1:{port}{path}", timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == len(targets):
                  print("pipeline services UP")
                  break
              time.sleep(3)
          else:
              raise SystemExit("pipeline services not up")
          EOF

      - name: Run true-pipeline E2E (Kafka -> Detect -> stores)
        run: python3 build/verify-pipeline.py

      - name: Run change chaos evidence (duplicate + Detection outbox replay)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          mkdir -p .cache/chaos
          set +e
          python3 build/chaos-pipeline.py --scenario duplicate_delivery \
            --run-id "change-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/duplicate-delivery.json
          duplicate_status=$?
          python3 build/chaos-pipeline.py --scenario detection_outbox_replay \
            --run-id "change-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/detection-outbox-replay.json
          replay_status=$?
          if [ "$duplicate_status" -ne 0 ] || [ "$replay_status" -ne 0 ]; then
            exit 1
          fi

      # Keep the nightly job deterministic here; the Compose-backed weekly
      # workflow owns process/database/OpenSearch outage experiments.
      - name: Run nightly chaos evidence (deterministic replay invariants)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .cache/chaos
          set +e
          python3 build/chaos-pipeline.py --scenario duplicate_delivery \
            --run-id "nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/duplicate-delivery.json
          duplicate_status=$?
          python3 build/chaos-pipeline.py --scenario detection_outbox_replay \
            --run-id "nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/detection-outbox-replay.json
          replay_status=$?
          if [ "$duplicate_status" -ne 0 ] || [ "$replay_status" -ne 0 ]; then
            exit 1
          fi

      - name: Print pipeline logs on failure
        if: failure()
        run: |
          ps -ef | grep -E 'search-config|detect-web|alert-web|report-web|api-gateway' | grep -v grep || true
          for log in "$GITHUB_WORKSPACE"/.cache/*.log; do
            echo "===== $log ====="
            tail -n 120 "$log" || true
          done

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-e2e-logs
          path: .cache/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Collect pipeline evidence
        if: always()
        run: |
          python3 build/collect-evidence.py --output .cache/evidence \
          --benchmark .cache/chaos/duplicate-delivery.json \
          --benchmark .cache/chaos/detection-outbox-replay.json

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: .cache/evidence/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop pipeline middleware
        if: always()
        run: bash build/compose.sh down -v
