name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOCP_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm (matches package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build backend (27 Maven modules)
        run: bash build/mvnw.sh -DskipTests package

      - name: Run backend tests
        run: bash build/mvnw.sh test -Dsurefire.failIfNoSpecifiedTests=false

      - name: Install frontend deps (pnpm frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend (workbench)
        run: node ../../node_modules/vite/bin/vite.js build
        working-directory: frontend/apps/workbench

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      SOCP_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: socp
          POSTGRES_PASSWORD: socp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend
        run: bash build/mvnw.sh -DskipTests package

      # 最小切片验证：alert-web + api-gateway（无 Kafka/OpenSearch/CK 依赖）
      - name: Start minimal slice (alert-web + gateway)
        run: |
          mkdir -p .cache
          bash build/run-slice.sh start || true
          python3 - <<'EOF'
          import time, urllib.request
          for i in range(60):
              ok = 0
              for port, path in [(18092, '/actuator/health'), (18080, '/alert-web/actuator/health')]:
                  try:
                      if urllib.request.urlopen(f'http://127.0.0.1:{port}{path}', timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == 2:
                  print('slice UP'); break
              time.sleep(3)
          else:
              raise SystemExit('slice not up')
          EOF

      - name: Run slice E2E (auth/tenant/audit/ratelimit/trace)
        run: python3 build/verify-slice.py

  # ─────────────────────────────────────────────────────────────
  # 真链路 E2E：Kafka → Detect → PostgreSQL + OpenSearch + ClickHouse
  # 注入 1 条攻击事件，验证完整 event-driven 链路（见 README「真链路验证」）：
  #   push 事件 → Kafka topic 出现 → Detection 命中 → PG alert →
  #   OpenSearch raw event → ClickHouse alarm_detail → API 查询
  # ─────────────────────────────────────────────────────────────
  e2e-pipeline:
    runs-on: ubuntu-latest
    needs: build
    env:
      SOCP_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      # CI 中间件均为本机服务地址（OpenSearch 关安全 → HTTP，ClickHouse 默认用户无密码）
      PIPELINE_OS: http://localhost:9200
      PIPELINE_OS_AUTH: "admin:"
      PIPELINE_CK: http://localhost:8123
      PIPELINE_CK_AUTH: "default:"
      PIPELINE_KAFKA: localhost:9092
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: socp
          POSTGRES_PASSWORD: socp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socp"
          --health-interval 5s --health-timeout 5s --health-retries 10
          --volume ${{ github.workspace }}/.github/pg-init:/docker-entrypoint-initdb.d
      kafka:
        image: apache/kafka:4.0.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_NUM_PARTITIONS: "3"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "bash -c '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1'"
          --health-interval 10s --health-timeout 10s --health-retries 15
      opensearch:
        image: opensearchproject/opensearch:2.11.1
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\|yellow'"
          --health-interval 10s --health-timeout 10s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client -q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: bash build/mvnw.sh -DskipTests package

      - name: Install kafka-python (pipeline probe)
        run: pip install kafka-python

      # 启动真链路 5 服务：search-config(归一化→Kafka/OS) + detect-web(规则引擎) +
      # alert-web(PG/CK) + report-web(报表) + api-gateway(鉴权/路由)
      - name: Start pipeline services
        run: |
          mkdir -p .cache
          export SOCP_OPENSEARCH_URL=http://localhost:9200
          export SOCP_OPENSEARCH_USERNAME=admin
          export SOCP_OPENSEARCH_PASSWORD=admin
          java -jar services/search-config/target/search-config-1.0.0-SNAPSHOT.jar --server.port=18081 > .cache/search-config.log 2>&1 &
          java -jar services/detect-web/target/detect-web-1.0.0-SNAPSHOT.jar --server.port=18082 > .cache/detect-web.log 2>&1 &
          java -jar services/alert-web/target/alert-web-1.0.0-SNAPSHOT.jar --server.port=18080 > .cache/alert-web.log 2>&1 &
          java -jar services/report-web/target/report-web-1.0.0-SNAPSHOT.jar --server.port=18084 > .cache/report-web.log 2>&1 &
          java -jar services/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar --server.port=18092 > .cache/api-gateway.log 2>&1 &
          python3 - <<'EOF'
          import time, urllib.request
          targets = [(18081, '/search-config/actuator/health'), (18082, '/detect-web/actuator/health'),
                     (18080, '/alert-web/actuator/health'), (18084, '/report-web/actuator/health'),
                     (18092, '/actuator/health')]
          for i in range(90):
              ok = 0
              for port, path in targets:
                  try:
                      if urllib.request.urlopen(f'http://127.0.0.1:{port}{path}', timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == 5:
                  print('pipeline services UP'); break
              time.sleep(3)
          else:
              raise SystemExit('pipeline services not up')
          EOF

      - name: Run true-pipeline E2E (Kafka→Detect→PG/OpenSearch/ClickHouse)
        run: python3 build/verify-pipeline.py
