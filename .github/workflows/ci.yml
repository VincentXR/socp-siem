name: Change CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # GitHub-hosted runners should use Maven Central directly. The repository
  # mirror remains the default for local development in mainland China.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOCP_TESTCONTAINERS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate disposable job credentials
        run: python3 build/prepare-ci-credentials.py --scope build

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm (matches package.json packageManager)
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Build, test, and analyze backend
        run: bash build/mvnw.sh verify -Pcoverage,quality -Dsurefire.failIfNoSpecifiedTests=false

      - name: Enforce coverage floor
        env:
          SOCP_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 build/verify-coverage.py
          python3 build/verify-changed-coverage.py

      - name: Verify repository contracts and versioned content
        run: python3 build/verify-repository.py --evidence-dir .cache/evidence

      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          /tmp/actionlint

      - name: Collect commit-scoped validation evidence
        if: always()
        run: python3 build/collect-evidence.py --output .cache/evidence

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-evidence
          path: .cache/evidence/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Install frontend deps (pnpm frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Verify generated SOAR OpenAPI SDK
        run: python3 build/verify-openapi-sdk.py --output .cache/evidence/openapi-sdk

      - name: Upload OpenAPI SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soar-openapi-sdk-evidence
          path: .cache/evidence/openapi-sdk/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Test frontend API contracts
        run: pnpm test
        working-directory: frontend/apps/workbench

      - name: Lint frontend sources
        run: pnpm lint
        working-directory: frontend/apps/workbench

      - name: Check frontend formatting
        run: pnpm format:check
        working-directory: frontend/apps/workbench

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/apps/workbench

      - name: Run workbench browser flows
        run: pnpm test:e2e
        working-directory: frontend/apps/workbench

      - name: Upload workbench browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-playwright-report
          path: |
            frontend/apps/workbench/playwright-report/
            frontend/apps/workbench/test-results/
          if-no-files-found: ignore

      - name: Verify frontend (typecheck, build, and artifact)
        run: pnpm verify
        working-directory: frontend/apps/workbench

      - name: Package backend JARs for E2E jobs
        run: |
          tar -czf backend-slice-jars.tgz \
            services/alert-web/target/alert-web-1.0.0-SNAPSHOT.jar \
            services/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar
          tar -czf backend-pipeline-extra-jars.tgz \
            services/search-config/target/search-config-1.0.0-SNAPSHOT.jar \
            services/detect-web/target/detect-web-1.0.0-SNAPSHOT.jar \
            services/report-web/target/report-web-1.0.0-SNAPSHOT.jar

      - name: Upload minimal-slice backend JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-slice-jars
          path: backend-slice-jars.tgz

      - name: Upload pipeline-only backend JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-pipeline-extra-jars
          path: backend-pipeline-extra-jars.tgz

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOCP_MAVEN_SETTINGS: "none"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test fail-closed dependency audit gate
        run: python3 -m unittest build/tests/test_verify_ossindex_audit.py

      - name: Review dependency changes with GitHub Dependency Graph
        id: github_review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

      - name: Decide whether fallback audit is required
        id: fallback
        if: steps.github_review.outcome == 'failure'
        env:
          VULNERABLE_CHANGES: ${{ steps.github_review.outputs['vulnerable-changes'] }}
        run: |
          if [[ -n "${VULNERABLE_CHANGES}" && "${VULNERABLE_CHANGES}" != "[]" && "${VULNERABLE_CHANGES}" != "{}" ]]; then
            echo "GitHub Dependency Review reported vulnerable dependency changes:"
            printf '%s\n' "${VULNERABLE_CHANGES}"
            exit 1
          fi
          echo "::notice::GitHub Dependency Graph unavailable; running lightweight repository-native dependency audits."
          echo "required=true" >> "${GITHUB_OUTPUT}"

      - name: Detect changed dependency manifests
        id: changed_dependencies
        if: steps.fallback.outputs.required == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | tee /tmp/dependency-changes.txt
          if grep -Eq '(^|/)pom\.xml$|^config/dependency-check-suppressions\.xml$' /tmp/dependency-changes.txt; then
            echo "java=true" >> "${GITHUB_OUTPUT}"
          else
            echo "java=false" >> "${GITHUB_OUTPUT}"
          fi
          if grep -Eq '^frontend/(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|.*/package\.json)$' /tmp/dependency-changes.txt; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
          else
            echo "frontend=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up JDK 21 for Java fallback audit
        if: steps.changed_dependencies.outputs.java == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Audit full Java runtime graph with fail-closed OSS Index fallback
        if: steps.changed_dependencies.outputs.java == 'true'
        timeout-minutes: 10
        env:
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p target
          rm -f target/ossindex-report.json target/ossindex-audit.log

          AUTH_ARGS=()
          if [[ -n "${OSSINDEX_USERNAME}" || -n "${OSSINDEX_TOKEN}" ]]; then
            if [[ -z "${OSSINDEX_USERNAME}" || -z "${OSSINDEX_TOKEN}" ]]; then
              echo "::error::OSS Index credentials are only partially configured."
              exit 1
            fi
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings = ET.Element("settings", xmlns="http://maven.apache.org/SETTINGS/1.0.0")
          servers = ET.SubElement(settings, "servers")
          server = ET.SubElement(servers, "server")
          ET.SubElement(server, "id").text = "socp-ossindex"
          ET.SubElement(server, "username").text = os.environ["OSSINDEX_USERNAME"]
          ET.SubElement(server, "password").text = os.environ["OSSINDEX_TOKEN"]
          ET.ElementTree(settings).write("/tmp/socp-ossindex-settings.xml",
                                         encoding="utf-8", xml_declaration=True)
          PY
            chmod 600 /tmp/socp-ossindex-settings.xml
            export SOCP_MAVEN_SETTINGS=/tmp/socp-ossindex-settings.xml
            AUTH_ARGS=(-Dossindex.authId=socp-ossindex)
          fi

          # ossindex.fail controls vulnerability findings only. Plugin 3.2.0 may
          # warn and exit zero when component-report retrieval fails, so the
          # repository verifier below is the fail-closed transport/result gate.
          bash build/mvnw.sh \
            org.sonatype.ossindex.maven:ossindex-maven-plugin:3.2.0:audit-aggregate \
            -Dossindex.scope=runtime \
            -Dossindex.cvssScoreThreshold=7.0 \
            -Dossindex.fail=false \
            -Dossindex.reportFile=target/ossindex-report.json \
            "${AUTH_ARGS[@]}" 2>&1 | tee target/ossindex-audit.log

          python3 build/verify-ossindex-audit.py \
            --scope runtime \
            --log target/ossindex-audit.log \
            --report target/ossindex-report.json

      - name: Upload OSS Index scan evidence
        if: always() && steps.changed_dependencies.outputs.java == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-java-runtime-ossindex-report
          path: |
            target/ossindex-report.json
            target/ossindex-audit.log
          if-no-files-found: error

      - name: Set up pnpm for frontend fallback audit
        if: steps.changed_dependencies.outputs.frontend == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5

      - name: Set up Node 22 for frontend fallback audit
        if: steps.changed_dependencies.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Audit changed frontend dependency graph
        if: steps.changed_dependencies.outputs.frontend == 'true'
        timeout-minutes: 8
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --registry=https://registry.npmjs.org --audit-level high

      - name: Record fallback with no dependency manifest changes
        if: >-
          steps.fallback.outputs.required == 'true' &&
          steps.changed_dependencies.outputs.java != 'true' &&
          steps.changed_dependencies.outputs.frontend != 'true'
        run: echo "Dependency Graph is unavailable, but this PR does not change dependency manifests or lockfiles."

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      SOCP_PG_USER: socp_runtime
      SOCP_PG_RUNTIME_USER: socp_runtime
      SOCP_PG_MIGRATION_USER: socp_migrator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate disposable job credentials
        run: python3 build/prepare-ci-credentials.py --scope integration

      - name: Start E2E middleware from the image catalog
        run: bash build/compose.sh up -d --wait postgres redis

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download backend JARs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-slice-jars
          path: .

      - name: Extract backend JARs
        run: tar -xzf backend-slice-jars.tgz

      - name: Prepare PostgreSQL databases
        run: bash build/prepare-postgres-ci.sh

      - name: Start minimal slice (alert-web + gateway)
        run: |
          mkdir -p .cache
          # CI deliberately exercises the PostgreSQL-backed slice. Local
          # development uses the same profile so slice checks exercise claim
          # and transaction semantics close to the deployed path.
          SOCP_RUNTIME_PROFILES=pg bash build/run-slice.sh start || true
          python3 - <<'EOF'
          import time
          import urllib.request

          for _ in range(60):
              ok = 0
              # The minimal slice intentionally omits Kafka and ClickHouse.
              # Check liveness here so optional dependency readiness does not
              # turn a successfully started process into a false CI failure.
              for port, path in [(18092, "/actuator/health/liveness"),
                                 (18080, "/alert-web/actuator/health/liveness")]:
                  try:
                      if urllib.request.urlopen(f"http://127.0.0.1:{port}{path}", timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == 2:
                  print("slice UP")
                  break
              time.sleep(3)
          else:
              raise SystemExit("slice not up")
          EOF

      - name: Print slice logs on startup failure
        if: failure()
        run: |
          for log in .cache/*.log; do
            echo "===== $log ====="
            tail -n 160 "$log" || true
          done

      - name: Run slice E2E (auth/tenant/audit/ratelimit/trace)
        run: python3 build/verify-slice.py

      - name: Upload slice logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slice-e2e-logs
          path: .cache/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop E2E middleware
        if: always()
        run: bash build/compose.sh down -v

  e2e-pipeline:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    env:
      SOCP_SECURITY_ALLOW_PROD_HMAC: "true"
      SOCP_PG_USER: socp_runtime
      SOCP_PG_RUNTIME_USER: socp_runtime
      SOCP_PG_MIGRATION_USER: socp_migrator
      SOCP_ALLOW_GLOBAL_INGEST_TOKEN: "false"
      SOCP_RUNTIME_PROFILES: pg
      SOCP_OPENSEARCH_DISABLE_SECURITY_PLUGIN: "true"
      PIPELINE_INGEST_URL: http://127.0.0.1:18081/search-config/api/v1/ingest
      PIPELINE_COLLECTOR_ID: ci-chaos
      SOCP_OPENSEARCH_URL: http://localhost:9200
      SOCP_OPENSEARCH_USERNAME: admin
      # CI middleware uses local HTTP OpenSearch and the configured ClickHouse credentials.
      PIPELINE_OS: http://localhost:9200
      PIPELINE_CK: http://localhost:8123
      PIPELINE_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate disposable job credentials
        run: python3 build/prepare-ci-credentials.py --scope integration

      - name: Start pipeline middleware from the image catalog
        run: bash build/compose.sh up -d --wait postgres redis kafka opensearch clickhouse

      - name: Prepare PostgreSQL databases
        run: bash build/prepare-postgres-ci.sh

      - name: Prepare ClickHouse schema
        run: |
          ck_container="$(bash build/compose.sh ps -q clickhouse)"
          test -n "$ck_container"
          docker exec -i "$ck_container" clickhouse-client \
            --user default --password "$SOCP_CK_PASSWORD" --multiquery \
            < infra/init-sql/clickhouse/init.sql

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download backend JARs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-slice-jars
          path: .

      - name: Download pipeline-only backend JARs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-pipeline-extra-jars
          path: .

      - name: Extract backend JARs
        run: |
          tar -xzf backend-slice-jars.tgz
          tar -xzf backend-pipeline-extra-jars.tgz

      - name: Install kafka-python (pipeline probe)
        run: pip install kafka-python==3.0.10

      - name: Boot core JARs with production-like contexts
        env:
          SOCP_AUTH_COOKIE_SECURE: "true"
          SOCP_RATELIMIT_BACKEND: redis
          SOCP_RATELIMIT_FAIL_CLOSED: "true"
          SOCP_AUDIT_SINK: kafka
          SOCP_AUDIT_FAIL_CLOSED: "true"
          SOCP_TENANT_RLS_ENABLED: "true"
          SOCP_OPENSEARCH_ENABLED: "false"
          SOCP_OPENSEARCH_USERNAME: ci-prod-smoke
          SOCP_OPENSEARCH_INSECURE_SKIP_VERIFY: "false"
          SOCP_MINIO_ENABLED: "false"
        run: |
          python3 build/verify-prod-boot.py --services \
          search-config detect-web alert-web report-web api-gateway

      - name: Start pipeline services
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache"
          export SOCP_OPENSEARCH_URL=http://localhost:9200
          export SOCP_OPENSEARCH_USERNAME=admin
          # Keep the pipeline E2E on the same PostgreSQL-backed profile used by
          # the Docker services. The gateway also needs dev for demo accounts.
          nohup java -jar services/search-config/target/search-config-1.0.0-SNAPSHOT.jar --server.port=18081 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/search-config.log" 2>&1 &
          nohup java -jar services/detect-web/target/detect-web-1.0.0-SNAPSHOT.jar --server.port=18082 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/detect-web.log" 2>&1 &
          nohup java -jar services/alert-web/target/alert-web-1.0.0-SNAPSHOT.jar --server.port=18080 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/alert-web.log" 2>&1 &
          nohup java -jar services/report-web/target/report-web-1.0.0-SNAPSHOT.jar --server.port=18084 --spring.profiles.active=pg > "$GITHUB_WORKSPACE/.cache/report-web.log" 2>&1 &
          nohup java -jar services/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar --server.port=18092 --spring.profiles.active=dev,pg > "$GITHUB_WORKSPACE/.cache/api-gateway.log" 2>&1 &
          python3 - <<'EOF'
          import time
          import urllib.request

          targets = [
              (18081, "/search-config/actuator/health"),
              (18082, "/detect-web/actuator/health"),
              (18080, "/alert-web/actuator/health"),
              (18084, "/report-web/actuator/health"),
              (18092, "/actuator/health"),
          ]
          for _ in range(90):
              ok = 0
              for port, path in targets:
                  try:
                      if urllib.request.urlopen(f"http://127.0.0.1:{port}{path}", timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == len(targets):
                  print("pipeline services UP")
                  break
              time.sleep(3)
          else:
              raise SystemExit("pipeline services not up")
          EOF

      - name: Run true-pipeline E2E (Kafka -> Detect -> stores)
        run: python3 build/verify-pipeline.py

      - name: Run change chaos evidence (duplicate + Detection outbox replay)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          mkdir -p .cache/chaos
          set +e
          python3 build/chaos-pipeline.py --scenario duplicate_delivery \
            --run-id "change-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/duplicate-delivery.json
          duplicate_status=$?
          python3 build/chaos-pipeline.py --scenario detection_outbox_replay \
            --run-id "change-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/detection-outbox-replay.json
          replay_status=$?
          if [ "$duplicate_status" -ne 0 ] || [ "$replay_status" -ne 0 ]; then
            exit 1
          fi

      # Manual runs can exercise the deterministic replay checks without
      # mixing a scheduled/nightly lifecycle into the change-validation CI.
      - name: Run manual replay evidence (deterministic replay invariants)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .cache/chaos
          set +e
          python3 build/chaos-pipeline.py --scenario duplicate_delivery \
            --run-id "manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/duplicate-delivery.json
          duplicate_status=$?
          python3 build/chaos-pipeline.py --scenario detection_outbox_replay \
            --run-id "manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/detection-outbox-replay.json
          replay_status=$?
          if [ "$duplicate_status" -ne 0 ] || [ "$replay_status" -ne 0 ]; then
            exit 1
          fi

      - name: Print pipeline logs on failure
        if: failure()
        run: |
          pgrep -af 'search-config|detect-web|alert-web|report-web|api-gateway' || true
          for log in "$GITHUB_WORKSPACE"/.cache/*.log; do
            echo "===== $log ====="
            tail -n 120 "$log" || true
          done

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-e2e-logs
          path: .cache/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Collect pipeline evidence
        if: always()
        run: |
          python3 build/collect-evidence.py --output .cache/evidence \
          --benchmark .cache/chaos/duplicate-delivery.json \
          --benchmark .cache/chaos/detection-outbox-replay.json

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-evidence
          path: .cache/evidence/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop pipeline middleware
        if: always()
        run: bash build/compose.sh down -v
