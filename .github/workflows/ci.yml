name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: socp/frontend/pnpm-lock.yaml

      - name: Build backend (27 Maven modules)
        run: bash socp/build/mvnw.sh -DskipTests package
        working-directory: socp

      - name: Run backend tests
        run: bash socp/build/mvnw.sh test -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: socp

      - name: Build frontend (workbench)
        run: node ../../node_modules/vite/bin/vite.js build
        working-directory: socp/frontend/apps/workbench

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: socp
          POSTGRES_PASSWORD: socp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend
        run: bash socp/build/mvnw.sh -DskipTests package
        working-directory: socp

      # 最小切片验证：alert-web + api-gateway（无 Kafka/OpenSearch/CK 依赖）
      - name: Start minimal slice (alert-web + gateway)
        run: |
          mkdir -p .cache
          bash socp/build/run-slice.sh start || true
          # 等 60s 直到 2 服务 UP
          python3 - <<'EOF'
          import time, urllib.request
          for i in range(60):
              ok = 0
              for port, path in [(18092, '/actuator/health'), (18080, '/alert-web/actuator/health')]:
                  try:
                      if urllib.request.urlopen(f'http://127.0.0.1:{port}{path}', timeout=2).status == 200:
                          ok += 1
                  except Exception:
                      pass
              if ok == 2:
                  print('slice UP'); break
              time.sleep(3)
          else:
              raise SystemExit('slice not up')
          EOF

      - name: Run slice E2E (auth/tenant/audit/ratelimit/trace)
        run: python3 socp/build/verify-slice.py
        working-directory: socp
