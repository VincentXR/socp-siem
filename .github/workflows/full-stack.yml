name: Full Stack E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

env:
  # Avoid depending on third-party mirror synchronization in hosted CI.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOCP_JWT_SECRET: ci-full-stack-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_LOGIN_SECRET: ci-full-stack-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_SECURITY_SERVICE_SECRET: ci-full-stack-service-secret-0123456789abcdef
      SOCP_RUNTIME_PROFILES: dev,pg
      SOCP_RATELIMIT_BACKEND: redis
      SOCP_RATELIMIT_FAIL_CLOSED: "true"
      SOCP_CLIENT_EXTERNAL_ALLOWED_HOSTS: "127.0.0.1,localhost"
      SOCP_CLIENT_EXTERNAL_HTTPS_ONLY: "false"
      SOCP_CLIENT_EXTERNAL_ALLOW_PRIVATE_NETWORKS: "true"
      SOCP_WEBHOOK_FIXTURE_PORT: "38421"
      SOCP_WEBHOOK_FIXTURE_URL: http://127.0.0.1:38421/notify
      # Fifteen Spring Boot processes plus Kafka/OpenSearch/ClickHouse run on one
      # hosted runner. Keep the evidence job inside a predictable memory budget.
      SOCP_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      # search-config also owns the Kafka-to-OpenSearch indexing worker. Kafka
      # client reinitialization after a broker outage needs more class metadata
      # headroom than the CRUD-oriented services, without increasing all JVMs.
      SOCP_SEARCH_CONFIG_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # SOAR loads the Temporal, connector, auth, and JPA stacks in one JVM.
      # Its steady-state metadata exceeds the generic 128 MiB evidence budget
      # under concurrent alarm evaluation, so keep the override service-local.
      SOCP_SOAR_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # The PostgreSQL container defaults to 100 connections. Hikari otherwise
      # reserves up to ten per JVM and exhausts the shared database during the
      # 15-service startup burst.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SOCP_COLLECTOR_CREDENTIALS: "ci-chaos|default|ci-chaos-collector-secret"
      SOCP_ALLOW_GLOBAL_INGEST_TOKEN: "false"
      PIPELINE_INGEST_URL: http://127.0.0.1:18081/search-config/api/v1/ingest
      PIPELINE_COLLECTOR_ID: ci-chaos
      PIPELINE_COLLECTOR_TOKEN: ci-chaos-collector-secret
      PIPELINE_OS: https://localhost:9200
      PIPELINE_OS_AUTH: "admin:Socp!Sec2026xK"
      PIPELINE_CK: http://localhost:8123
      PIPELINE_CK_AUTH: "default:socp"
      PIPELINE_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Start integration middleware
        # Full-stack verification does not require dashboards, Keycloak,
        # Temporal UI, Loki, or Jaeger. Starting those containers previously
        # starved the application JVMs and made startup evidence flaky.
        run: >-
          docker compose -f infra/docker-compose.yml up -d
          postgres kafka opensearch redis clickhouse minio

      - name: Build backend
        run: bash build/mvnw.sh -DskipTests package

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build and verify frontend
        run: pnpm verify
        working-directory: frontend/apps/workbench

      - name: Install pipeline probe dependency
        run: python3 -m pip install kafka-python==3.0.10

      - name: Start all backend services
        run: bash build/run-all.sh backend full

      - name: Start persistent webhook verification fixture
        run: |
          mkdir -p .cache
          python3 build/webhook-sink.py --port "$SOCP_WEBHOOK_FIXTURE_PORT" \
            > .cache/webhook-sink.log 2>&1 &
          echo $! > .cache/webhook-sink.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${SOCP_WEBHOOK_FIXTURE_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .cache/webhook-sink.log
          exit 1

      - name: Run full API verification
        run: python3 build/verify-full.py

      - name: Run true event-pipeline verification
        run: python3 build/verify-pipeline.py

      - name: Run Compose-backed dependency chaos evidence
        run: |
          mkdir -p .cache/chaos
          python3 build/chaos-pipeline.py --scenario all \
            --run-id "weekly-dependency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/dependency-matrix.json

      - name: Start fixed three-instance Detection cluster
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
        run: bash build/detection-cluster.sh start

      - name: Run weekly multi-instance chaos evidence
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_REQUIRE_DOWNSTREAM_DRAIN: "true"
          DETECTION_INSTANCE_URLS: http://127.0.0.1:18082,http://127.0.0.1:28082,http://127.0.0.1:38082
        run: |
          mkdir -p .cache/chaos
          python3 build/chaos-pipeline.py --scenario multi_instance --count 30 \
            --rebalance-cycles 3 --run-id "weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/multi-instance.json

      - name: Run Golden Demo
        run: python3 build/demos/golden-demo.py --transport ingest

      - name: Run Detection recovery demo
        run: python3 build/demos/detection-recovery.py

      - name: Run attack scenario demo
        run: python3 build/demos/attack-scenarios.py

      - name: Run dependency failure injection
        run: python3 build/failure-tests.py

      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache
          docker compose -f infra/docker-compose.yml logs --no-color > .cache/compose.log 2>&1 || true

      - name: Collect commit-scoped full-stack evidence
        if: always()
        run: python3 build/collect-evidence.py --output .cache/evidence \
          --benchmark .cache/chaos/dependency-matrix.json \
          --benchmark .cache/chaos/multi-instance.json

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-logs
          path: .cache/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          if [ -f .cache/webhook-sink.pid ]; then
            kill "$(cat .cache/webhook-sink.pid)" 2>/dev/null || true
          fi
          bash build/detection-cluster.sh stop || true
          bash build/run-all.sh stop || true
          docker compose -f infra/docker-compose.yml down || true
