name: Full Stack E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_load_soak:
        description: Run an additional one-hour 5 EPS load/soak verification
        type: boolean
        default: false
      run_load_pressure:
        description: Run 10,25,50,100 EPS pressure stages for five minutes each
        type: boolean
        default: false
      run_load_capacity:
        description: Run 250,500,1000,2000 canonical EPS stages for two minutes each
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: full-stack-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Avoid depending on third-party mirror synchronization in hosted CI.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether full-stack evidence is applicable
        env:
          RUN_LOAD_SOAK: ${{ inputs.run_load_soak }}
          RUN_LOAD_PRESSURE: ${{ inputs.run_load_pressure }}
          RUN_LOAD_CAPACITY: ${{ inputs.run_load_capacity }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          load_modes=0
          for enabled in "$RUN_LOAD_SOAK" "$RUN_LOAD_PRESSURE" "$RUN_LOAD_CAPACITY"; do
            if [ "$enabled" = "true" ]; then load_modes=$((load_modes + 1)); fi
          done
          if [ "$load_modes" -gt 1 ]; then
            echo "Choose only one of capacity, pressure or soak verification"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/full-stack-changes.txt
          run_heavy="$(python3 build/ci-scope.py --paths-file /tmp/full-stack-changes.txt)"
          if [ "$run_heavy" = "true" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
            echo "Full-stack skipped: known non-runtime files only"
          fi

  full-stack-heavy:
    name: ${{ inputs.run_load_capacity && 'canonical-capacity' || 'full-stack-heavy' }}
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # Original full-stack budget plus the bounded patched Vector source build.
    timeout-minutes: ${{ (inputs.run_load_soak || inputs.run_load_pressure || inputs.run_load_capacity) && 200 || 130 }}
    env:
      SOCP_PG_USER: socp_runtime
      SOCP_PG_RUNTIME_USER: socp_runtime
      SOCP_PG_MIGRATION_USER: socp_migrator
      SOCP_RUNTIME_PROFILES: dev,pg
      # Both the production-context boot smoke and the live dev,pg SOAR
      # instances must target the Temporal service started below.
      SOCP_TEMPORAL_TARGET: localhost:7233
      SOCP_RATELIMIT_BACKEND: redis
      SOCP_RATELIMIT_FAIL_CLOSED: "true"
      # The live Playwright task uses the Vite server on this exact origin.
      # Keep the gateway's cookie-auth CSRF check enabled, preserve its local
      # defaults, and add only that isolated browser origin for unsafe requests.
      SOCP_AUTH_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:18092,http://127.0.0.1:4173"
      SOCP_CLIENT_EXTERNAL_ALLOWED_HOSTS: "127.0.0.1,localhost"
      SOCP_CLIENT_EXTERNAL_HTTPS_ONLY: "false"
      SOCP_CLIENT_EXTERNAL_ALLOW_PRIVATE_NETWORKS: "true"
      SOCP_WEBHOOK_FIXTURE_PORT: "28421"
      SOCP_WEBHOOK_FIXTURE_URL: http://127.0.0.1:28421/notify
      # Fifteen Spring Boot processes plus Kafka/OpenSearch/ClickHouse run on one
      # hosted runner. Keep the evidence job inside a predictable memory budget.
      SOCP_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      # search-config also owns the Kafka-to-OpenSearch indexing worker. Kafka
      # client reinitialization after a broker outage needs more class metadata
      # headroom than the CRUD-oriented services, without increasing all JVMs.
      SOCP_SEARCH_CONFIG_JVM_OPTS: ${{ inputs.run_load_capacity && '-Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -Dspring.datasource.hikari.maximum-pool-size=8' || '-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC' }}
      # Detection includes routing, JPA, Kafka and runtime OpenAPI generation;
      # the generic 128 MiB metadata cap exhausts Metaspace after startup.
      SOCP_DETECT_WEB_JVM_OPTS: ${{ inputs.run_load_capacity && '-Xms128m -Xmx768m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -Dspring.datasource.hikari.maximum-pool-size=8' || '-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC' }}
      # Exercise mixed-shard partition batches in both functional recovery and
      # capacity runs. Source event shape and acceptance thresholds stay fixed.
      SOCP_DETECT_STATE_SHARDS: "4"
      # Alert also loads enrichment, delivery, JPA and OpenAPI. Its first
      # paginated alarm request exceeds the generic metadata budget.
      SOCP_ALERT_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # SOAR loads the Temporal, connector, auth, and JPA stacks in one JVM.
      # Its steady-state metadata exceeds the generic 128 MiB evidence budget
      # under concurrent alarm evaluation, so keep the override service-local.
      SOCP_SOAR_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Incident's JPA, audit, OpenAPI and lazily loaded Redis nonce client
      # exceed 128 MiB after routed recovery. A wrapped Metaspace OOM otherwise
      # looks like a Redis outage and can stall durable alarm deliveries.
      SOCP_INCIDENT_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Boot 4's soc-base audit consumer and runtime OpenAPI generation exhaust
      # the 128 MiB Metaspace cap together. Add 64 MiB only to this service;
      # keep its heap bounded and retain the job's strict JVM OOM gate.
      SOCP_SOC_BASE_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Threat enrichment lazily loads Kafka producer classes while IOC match
      # requests are active. Boot 4 exceeds 128 MiB Metaspace on that path;
      # retain the bounded heap and strict OOM check with service-local headroom.
      SOCP_THREAT_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Real AI assistant user flows with the Boot 4 retrieval/tool stack use
      # more than 128 MiB of class metadata. Keep its extra headroom local too.
      SOCP_AI_ASSISTANT_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Notify's Redis nonce recovery path exceeded 128 MiB Metaspace during
      # routed multi-instance chaos, leaving durable notifications pending.
      # Add only service-local metadata headroom; retain heap and OOM gates.
      SOCP_NOTIFY_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # The PostgreSQL container defaults to 100 connections. Hikari otherwise
      # reserves up to ten per JVM and exhausts the shared database during the
      # 15-service startup burst.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SOCP_ALLOW_GLOBAL_INGEST_TOKEN: "false"
      PIPELINE_INGEST_URL: http://127.0.0.1:18081/search-config/api/v1/ingest
      PIPELINE_COLLECTOR_ID: ci-chaos
      PIPELINE_OS: https://localhost:9200
      PIPELINE_CK: http://localhost:8123
      PIPELINE_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore source-keyed Vector image
        id: vector_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vector-image/vector.tar.gz
          key: vector-runtime-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agents/vector-runtime/**', 'build/vector-runtime.sh') }}

      - name: Build and verify patched Vector runtime
        # Rust compilation has its own budget; delivery tests keep their deadlines.
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p target/vector-delivery-evidence
          if [ -f .cache/vector-image/vector.tar.gz ]; then
            gzip -dc .cache/vector-image/vector.tar.gz | docker image load 2>&1 | tee target/vector-delivery-evidence/runtime-build.log
          else
            bash build/vector-runtime.sh image 2>&1 | tee target/vector-delivery-evidence/runtime-build.log
          fi
          bash build/vector-runtime.sh verify-image 2>&1 | tee target/vector-delivery-evidence/runtime-image.log
          source infra/middleware-images.env
          mkdir -p target/vector-delivery-evidence/runtime
          docker image inspect "$SOCP_VECTOR_IMAGE" > target/vector-delivery-evidence/runtime/image-inspect.json
          for file in provenance.json sbom.cdx.json buffer-tests.passed.json buffer-tests.list build-apk-packages.txt runtime-apk-db ldd.txt; do
            docker run --rm --network none --entrypoint /bin/cat "$SOCP_VECTOR_IMAGE" \
              "/usr/share/vector/socp/$file" > "target/vector-delivery-evidence/runtime/$file"
          done

      - name: Archive verified Vector image
        if: steps.vector_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source infra/middleware-images.env
          mkdir -p .cache/vector-image
          docker image save "$SOCP_VECTOR_IMAGE" | gzip -1 > .cache/vector-image/vector.tar.gz

      - name: Package verified Vector runtime for local collection
        env:
          SOCP_VECTOR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/vector-runtime-verified
          cp .cache/vector-image/vector.tar.gz target/vector-runtime-verified/
          cp target/vector-delivery-evidence/runtime/{provenance.json,sbom.cdx.json,image-inspect.json,buffer-tests.passed.json} target/vector-runtime-verified/
          cp agents/vector-runtime/runtime.lock.json target/vector-runtime-verified/
          cp target/vector-delivery-evidence/runtime-image.log target/vector-runtime-verified/verify-image.log
          printf '%s\n' "$GITHUB_SHA" > target/vector-runtime-verified/repository-commit.txt
          printf '%s\n' "$SOCP_VECTOR_HEAD_SHA" > target/vector-runtime-verified/workflow-head-commit.txt
          cd target/vector-runtime-verified
          sha256sum vector.tar.gz provenance.json sbom.cdx.json image-inspect.json buffer-tests.passed.json runtime.lock.json verify-image.log repository-commit.txt workflow-head-commit.txt > SHA256SUMS

      # Publish only the verified image and explicit provenance files, before
      # integration credentials are generated or later acceptance checks run.
      # This artifact verifies runtime identity, not the overall job outcome.
      - name: Upload verified Vector runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-runtime-verified
          path: target/vector-runtime-verified/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Save verified Vector image
        if: steps.vector_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vector-image/vector.tar.gz
          key: ${{ steps.vector_cache.outputs.cache-primary-key }}

      - name: Generate disposable job credentials
        run: python3 build/prepare-ci-credentials.py --scope integration

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Start integration middleware
        # Full-stack verification does not require dashboards, Keycloak,
        # Temporal UI, Loki, or Jaeger. Temporal itself is required: SOAR must
        # prove durable dispatch rather than silently accepting a queued-only
        # run when the orchestration dependency is absent.
        run: >-
          bash build/compose.sh up -d --wait --wait-timeout 180
          postgres kafka opensearch redis clickhouse minio

      - name: Start Temporal for SOAR evidence
        run: >-
          bash build/compose.sh --profile extra up -d
          temporal

      - name: Wait for Temporal namespace and verify database ownership
        run: |
          python3 - <<'PY'
          import subprocess
          import time

          deadline = time.monotonic() + 180
          last_output = ""
          while time.monotonic() < deadline:
              try:
                  probe = subprocess.run([
                      "bash", "build/compose.sh", "--profile", "extra", "exec", "-T",
                      "temporal", "temporal", "--address", "temporal:7233",
                      "operator", "namespace", "describe", "-n", "default",
                  ], capture_output=True, text=True, timeout=10)
                  last_output = probe.stdout + probe.stderr
                  if probe.returncode == 0:
                      print("Temporal default namespace is reachable through gRPC")
                      break
              except subprocess.TimeoutExpired:
                  last_output = "Temporal namespace probe timed out"
              time.sleep(2)
          else:
              raise SystemExit("Temporal namespace did not become ready: " + last_output)
          PY
          docker exec -i socp-postgres psql -U socp -d template1 -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('socp_migrator', 'socp_runtime')
                       AND (rolsuper OR rolcreatedb OR rolbypassrls)) THEN
              RAISE EXCEPTION 'Temporal bootstrap widened application role privileges';
            END IF;
            IF (SELECT count(*) FROM pg_database WHERE datname IN ('temporal', 'temporal_visibility')
                AND pg_get_userbyid(datdba) = 'socp_migrator') <> 2 THEN
              RAISE EXCEPTION 'Temporal databases do not have the expected restricted owner';
            END IF;
            IF has_database_privilege('socp_runtime', 'temporal', 'CONNECT')
               OR has_database_privilege('socp_runtime', 'temporal_visibility', 'CONNECT') THEN
              RAISE EXCEPTION 'application runtime role can access Temporal internal databases';
            END IF;
          END $$;
          SQL

      - name: Build backend
        run: bash build/mvnw.sh -DskipTests package

      - name: Verify ordered ingestion and external-side-effect recovery
        env:
          SOCP_TESTCONTAINERS: "true"
        run: >-
          bash build/mvnw.sh
          -pl services/search-config,services/detect-web,services/ai-assistant
          -am test
          -Dtest=VectorConfigRendererContainerTest,ConfiguredEventTimePersistenceTest,IngestionOutboxOrderingPersistenceTest,IngestionOutboxClaimPostgresTest,DetectionBatchPostgresTest,PersistentWatchlistPostgresTest,DetectionRouteOutboxPostgresTest,InvestigationAppendAuditPostgresTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Boot every packaged service with a production-like context
        env:
          SOCP_AUTH_COOKIE_SECURE: "true"
          SOCP_TENANT_RLS_ENABLED: "true"
          SOCP_AUDIT_SINK: kafka
          SOCP_AUDIT_FAIL_CLOSED: "true"
          SOCP_OPENSEARCH_ENABLED: "false"
          SOCP_OPENSEARCH_USERNAME: ci-prod-smoke
          SOCP_OPENSEARCH_INSECURE_SKIP_VERIFY: "false"
          SOCP_SOAR_ARTIFACT_S3_ENDPOINT: https://localhost:19443
          SOCP_SOAR_ARTIFACT_S3_BUCKET: socp-soar-artifacts
        run: |
          set -euo pipefail
          # Use a real TLS endpoint and projected secret files for prod guards.
          source infra/middleware-images.env
          cleanup() {
            docker logs socp-minio-prod-smoke > .cache/prod-boot/minio-tls.log 2>&1 || true
            docker rm -f socp-minio-prod-smoke >/dev/null 2>&1 || true
            rm -rf -- .cache/prod-boot/minio-certs .cache/prod-boot/secrets .cache/prod-boot/minio-truststore.p12
          }
          trap cleanup EXIT
          mkdir -p .cache/prod-boot/minio-certs .cache/prod-boot/secrets/platform/soar-artifacts
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout .cache/prod-boot/minio-certs/private.key \
            -out .cache/prod-boot/minio-certs/public.crt
          keytool -importcert -noprompt -alias ci-minio \
            -file .cache/prod-boot/minio-certs/public.crt \
            -keystore .cache/prod-boot/minio-truststore.p12 -storepass "$SOCP_CI_TRUSTSTORE_PASSWORD"
          printf '%s' socp_minio > .cache/prod-boot/secrets/platform/soar-artifacts/access-key
          printf '%s' "$SOCP_MINIO_SECRET" > .cache/prod-boot/secrets/platform/soar-artifacts/secret-key
          export SOCP_SOAR_K8S_SECRET_MOUNT_PATH="$PWD/.cache/prod-boot/secrets"
          export JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=$PWD/.cache/prod-boot/minio-truststore.p12 -Djavax.net.ssl.trustStorePassword=$SOCP_CI_TRUSTSTORE_PASSWORD"
          docker run -d --name socp-minio-prod-smoke -p 127.0.0.1:19443:9000 \
            -v "$PWD/.cache/prod-boot/minio-certs:/certs:ro" \
            -e MINIO_ROOT_USER=socp_minio -e "MINIO_ROOT_PASSWORD=$SOCP_MINIO_SECRET" \
            --entrypoint /usr/bin/minio "$SOCP_MINIO_IMAGE" server /data --certs-dir /certs
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            --cacert .cache/prod-boot/minio-certs/public.crt \
            https://localhost:19443/minio/health/live
          python3 build/verify-prod-boot.py
          # Assert PostgreSQL's actual type and published migration history,
          # using the same database that the packaged service just upgraded.
          bash build/compose.sh exec -T -e "PGPASSWORD=$SOCP_PG_MIGRATION_PASSWORD" \
            postgres psql -h localhost -U "$SOCP_PG_MIGRATION_USER" -d threat -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 't_ioc'
                           AND column_name = 'confidence' AND data_type = 'double precision') THEN
              RAISE EXCEPTION 'confidence did not migrate to double precision';
            END IF;
            IF to_regtype('double') IS NOT NULL THEN
              RAISE EXCEPTION 'migration compatibility domain leaked into the fresh database';
            END IF;
            IF (SELECT count(*) FROM flyway_schema_history WHERE success AND version IN ('1','2','3','4','5')) <> 5 THEN
              RAISE EXCEPTION 'published threat migration history is incomplete';
            END IF;
          END $$;
          SQL

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build and verify frontend
        run: pnpm verify
        working-directory: frontend/apps/workbench

      - name: Install pipeline probe dependency
        run: python3 -m pip install kafka-python==3.0.10

      - name: Start all backend services
        run: bash build/run-all.sh backend full

      - name: Verify Actuator authentication boundary
        env:
          SOCP_GATEWAY_URL: http://127.0.0.1:18092
        run: python3 build/verify-actuator-auth.py

      - name: Verify generated SDK against runtime SOAR OpenAPI
        env:
          SOAR_OPENAPI_BASE_URL: http://127.0.0.1:18092/soar-web
          SOCP_GATEWAY_URL: http://127.0.0.1:18092
          SOAR_OPENAPI_REQUIRE_RUNTIME: "true"
          SOAR_OPENAPI_OUTPUT: .cache/openapi-sdk
          SOAR_VERIFY_USERNAME: admin
        run: python3 build/verify-openapi-sdk.py

      - name: Start a second SOAR instance for admission evidence
        run: |
          mkdir -p .cache
          read -r -a secondary_jvm_args <<< "${SOCP_SOAR_WEB_JVM_OPTS:--Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC}"
          nohup java "${secondary_jvm_args[@]}" \
            -jar services/soar-web/target/soar-web-1.0.0-SNAPSHOT.jar \
            --server.port=28083 --spring.profiles.active=dev,pg \
            --spring.main.banner-mode=off \
            > .cache/soar-web-secondary.log 2>&1 &
          echo $! > .cache/soar-web-secondary.pid
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          target = "http://127.0.0.1:28083/soar-web/health"
          for _ in range(90):
              try:
                  with urllib.request.urlopen(target, timeout=2) as response:
                      body = json.loads(response.read().decode("utf-8"))
                      details = body.get("data", body)
                      temporal = details.get("temporal", {}) if isinstance(details, dict) else {}
                      if (response.status == 200 and details.get("status") == "UP"
                              and temporal.get("status") == "UP"):
                          print("secondary SOAR instance and Temporal are reachable")
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("secondary SOAR instance did not become reachable")
          PY

      - name: Run SOAR live and multi-instance verification
        env:
          SOAR_PRIMARY_URL: http://127.0.0.1:18092/soar-web
          SOAR_SECONDARY_URL: http://127.0.0.1:28083/soar-web
          SOAR_REQUIRE_SECONDARY: "true"
          SOAR_LIVE_EVIDENCE_PATH: .cache/soar-live.json
          SOAR_VERIFY_USERNAME: admin
        run: python3 build/verify-soar-live.py

      - name: Start persistent webhook verification fixture
        run: |
          mkdir -p .cache
          python3 build/webhook-sink.py --port "$SOCP_WEBHOOK_FIXTURE_PORT" \
            > .cache/webhook-sink.log 2>&1 &
          echo $! > .cache/webhook-sink.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${SOCP_WEBHOOK_FIXTURE_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .cache/webhook-sink.log
          exit 1

      - name: Run full API verification
        run: python3 build/verify-full.py

      - name: Install Chromium for live user-task acceptance
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/apps/workbench

      - name: Run live workbench and log-source browser acceptance
        env:
          SOCP_LIVE_E2E: "true"
          SOCP_GATEWAY_URL: http://127.0.0.1:18092
          SOCP_E2E_USERNAME: admin
        run: pnpm exec playwright test e2e/live-source-workflow.spec.ts e2e/live-workbench-acceptance.spec.ts --workers=1
        working-directory: frontend/apps/workbench

      - name: Run true event-pipeline verification
        run: python3 build/verify-pipeline.py

      # A manual capacity run has its own bounded workload. The PR-triggered
      # run still executes every chaos/rebalance/migration gate on the same SHA.
      # Do not feed a new migration group the capacity dataset under the separate
      # small-fixture oracle deadline. Keep API/browser/pipeline checks above.
      - name: Start bounded capacity profiling
        id: capacity_profile
        if: ${{ inputs.run_load_capacity }}
        run: |
          mkdir -p .cache/capacity-profile
          # Start from an empty event set: do not record environment variables,
          # system properties, command lines, request bodies or credentials.
          jfr configure --input none --output .cache/capacity-profile/events.jfc \
            '+jdk.ExecutionSample#enabled=true' '+jdk.ExecutionSample#period=20ms' \
            '+jdk.NativeMethodSample#enabled=true' '+jdk.NativeMethodSample#period=20ms' \
            '+jdk.ThreadPark#enabled=true' '+jdk.ThreadPark#threshold=5ms' '+jdk.ThreadPark#stackTrace=true' \
            '+jdk.JavaMonitorEnter#enabled=true' '+jdk.JavaMonitorEnter#threshold=5ms' '+jdk.JavaMonitorEnter#stackTrace=true' \
            '+jdk.SocketRead#enabled=true' '+jdk.SocketRead#threshold=5ms' '+jdk.SocketRead#stackTrace=true' \
            '+jdk.SocketWrite#enabled=true' '+jdk.SocketWrite#threshold=5ms' '+jdk.SocketWrite#stackTrace=true' \
            '+jdk.FileWrite#enabled=true' '+jdk.FileWrite#threshold=5ms' '+jdk.FileWrite#stackTrace=true' \
            '+jdk.GarbageCollection#enabled=true' '+jdk.CPULoad#enabled=true' '+jdk.CPULoad#period=1s' \
            '+jdk.ThreadCPULoad#enabled=true' '+jdk.ThreadCPULoad#period=1s'
          for service in search-config detect-web alert-web; do
            pid=$(cat ".cache/$service.pid")
            [[ "$pid" =~ ^[0-9]+$ ]]
            jcmd "$pid" JFR.start name=capacity settings=.cache/capacity-profile/events.jfc maxsize=32m disk=true
          done

      - name: Run optional 2000 EPS capacity verification
        if: ${{ inputs.run_load_capacity }}
        timeout-minutes: 45
        run: >-
          python3 build/verify-load-soak.py --allow-local-fixture
          --mode capacity --seconds 120 --stages 250,500,1000,2000
          --warmup-eps 50 --warmup-seconds 120
          --require-state-snapshot --report-dir .cache/load-capacity

      - name: Save capacity profiles after success or failure
        if: ${{ always() && steps.capacity_profile.outcome == 'success' }}
        run: |
          status=0
          for service in search-config detect-web alert-web; do
            pid=$(cat ".cache/$service.pid")
            [[ "$pid" =~ ^[0-9]+$ ]]
            jcmd "$pid" JFR.dump name=capacity filename="$PWD/.cache/capacity-profile/$service.jfr" || status=1
            jcmd "$pid" JFR.stop name=capacity || status=1
          done
          exit "$status"

      - name: Run optional one-hour load and soak verification
        if: ${{ inputs.run_load_soak }}
        timeout-minutes: 75
        run: >-
          python3 build/verify-load-soak.py --allow-local-fixture
          --seconds 3600 --eps 5 --report-dir .cache/load-soak

      - name: Run optional bounded pressure verification
        if: ${{ inputs.run_load_pressure }}
        timeout-minutes: 45
        run: >-
          python3 build/verify-load-soak.py --allow-local-fixture
          --mode pressure --seconds 300 --stages 10,25,50,100
          --require-state-snapshot
          --report-dir .cache/load-pressure

      - name: Run Compose-backed dependency chaos evidence
        if: ${{ !inputs.run_load_capacity }}
        run: |
          mkdir -p .cache/chaos
          python3 build/chaos-pipeline.py --scenario all \
            --run-id "weekly-dependency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/dependency-matrix.json

      # This demo stops the only canonical consumer. Run it before replacing
      # that generation with three routed consumers and their separate router.
      - name: Run Detection recovery demo
        if: ${{ !inputs.run_load_capacity }}
        run: python3 build/demos/detection-recovery.py

      # This demo uses local HTTP Detection ingestion, whose shard must belong
      # to the contacted worker. Exercise it while one worker owns all shards.
      - name: Run attack scenario demo
        if: ${{ !inputs.run_load_capacity }}
        run: python3 build/demos/attack-scenarios.py

      - name: Start fixed three-instance routed Detection cluster
        if: ${{ !inputs.run_load_capacity }}
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_DETECT_INPUT_TOPIC: socp-detection-routed-v2
          SOCP_DETECT_ROUTING_MODE: primary
          SOCP_DETECT_OUTPUT_MODE: primary
          SOCP_DETECT_ROUTING_PUBLISHER_ENABLED: "true"
          SOCP_DETECT_CLUSTER_MIN_PARTITIONS: "6"
        run: bash build/detection-cluster.sh start

      - name: Run weekly routed multi-instance chaos evidence
        if: ${{ !inputs.run_load_capacity }}
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_DETECT_INPUT_TOPIC: socp-detection-routed-v2
          SOCP_DETECT_ROUTING_MODE: primary
          SOCP_DETECT_OUTPUT_MODE: primary
          SOCP_DETECT_ROUTING_PUBLISHER_ENABLED: "true"
          SOCP_DETECT_ROUTING_SOURCE_TOPIC: socp-events
          SOCP_DETECT_ROUTING_SOURCE_GROUP_ID: socp-detect-router-v2
          RECOVERY_TOPIC: socp-detection-routed-v2
          SOCP_REQUIRE_DOWNSTREAM_DRAIN: "true"
          DETECTION_INSTANCE_URLS: http://127.0.0.1:18082,http://127.0.0.1:28082,http://127.0.0.1:28083
        run: |
          mkdir -p .cache/chaos
          python3 build/chaos-pipeline.py --scenario multi_instance --count 30 \
            --rebalance-cycles 3 --run-id "weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/multi-instance.json

      - name: Run routed migration and rollback evidence
        if: ${{ !inputs.run_load_capacity }}
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_DETECT_INPUT_TOPIC: socp-detection-routed-v2
          SOCP_DETECT_ROUTING_MODE: primary
          SOCP_DETECT_OUTPUT_MODE: primary
          SOCP_DETECT_ROUTING_PUBLISHER_ENABLED: "true"
          SOCP_DETECT_ROUTING_SOURCE_TOPIC: socp-events
          SOCP_DETECT_ROUTING_SOURCE_GROUP_ID: socp-detect-router-v2
          RECOVERY_TOPIC: socp-detection-routed-v2
          SOCP_REQUIRE_DOWNSTREAM_DRAIN: "true"
          DETECTION_INSTANCE_URLS: http://127.0.0.1:18082,http://127.0.0.1:28082,http://127.0.0.1:28083
        run: |
          python3 build/chaos-pipeline.py --scenario routed_migration --count 20 \
            --run-id "weekly-mig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/routed-migration.json
          python3 build/chaos-pipeline.py --scenario routing_rollback --count 20 \
            --run-id "weekly-rrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/routing-rollback.json
          # Retain the exact namespace of the previously failed rollback so
          # randomized entity/partition placement cannot hide that regression.
          python3 build/chaos-pipeline.py --scenario routing_rollback --count 20 \
            --run-id weekly-rrb-35543128202-1 \
            --output .cache/chaos/routing-rollback-regression.json
          # Reproduce the later paused-partition failure's exact event placement.
          python3 build/chaos-pipeline.py --scenario routing_rollback --count 20 \
            --run-id weekly-rrb-35547751262-1 \
            --output .cache/chaos/routing-rollback-pause-regression.json

      - name: Run Golden Demo
        if: ${{ !inputs.run_load_capacity }}
        id: golden_demo
        env:
          GOLDEN_DEMO_DB_EVIDENCE: "true"
        run: python3 build/demos/golden-demo.py --transport vector --isolated-vector

      - name: Run dependency failure injection
        if: ${{ !inputs.run_load_capacity && !cancelled() && (steps.golden_demo.outcome == 'success' || steps.golden_demo.outcome == 'failure') }}
        run: python3 build/failure-tests.py

      - name: Capture blocked service threads on failure
        if: failure()
        run: |
          mkdir -p .cache/failure-threads
          for service in search-config detect-web soar-web soar-web-secondary; do
            if [ -f ".cache/$service.pid" ]; then
              pid=$(cat ".cache/$service.pid")
              if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
                timeout 15s jcmd "$pid" Thread.print -l > ".cache/failure-threads/$service.txt" 2>&1 || true
              fi
            fi
          done

      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache
          bash build/compose.sh --profile extra logs --no-color > .cache/compose.log 2>&1 || true

      - name: Collect commit-scoped full-stack evidence
        # Capacity has its own commit-bound final.json and reconciliation evidence.
        # Only the complete suite can produce the required chaos attestations.
        if: ${{ always() && !inputs.run_load_capacity }}
        run: |
          python3 build/collect-evidence.py --output .cache/evidence \
          --benchmark .cache/chaos/dependency-matrix.json \
          --benchmark .cache/chaos/multi-instance.json

      - name: Reject JVM memory exhaustion even when a later retry recovered
        if: always()
        run: python3 build/verify-jvm-memory.py

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-stack-e2e-logs
          path: |
            .cache/
            !.cache/vector-runtime/**
            !.cache/vector-image/**
            target/vector-delivery-evidence/
            services/search-config/target/vector-delivery-evidence/
            frontend/apps/workbench/test-results/
            frontend/apps/workbench/playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          if [ -f .cache/webhook-sink.pid ]; then
            kill "$(cat .cache/webhook-sink.pid)" 2>/dev/null || true
          fi
          if [ -f .cache/soar-web-secondary.pid ]; then
            kill "$(cat .cache/soar-web-secondary.pid)" 2>/dev/null || true
          fi
          bash build/detection-cluster.sh stop || true
          bash build/run-all.sh stop || true
          bash build/compose.sh --profile extra down || true

  full-stack:
    if: always()
    needs: [changes, full-stack-heavy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require heavy validation when applicable
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAVY_RESULT: ${{ needs.full-stack-heavy.result }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
        run: |
          if [ "$RUN_HEAVY" = "true" ]; then
            python3 build/verify-ci-gate.py \
              --required "changes=${CHANGES_RESULT}" \
              --required "full-stack-heavy=${HEAVY_RESULT}"
          elif [ "$RUN_HEAVY" = "false" ]; then
            python3 build/verify-ci-gate.py \
              --required "changes=${CHANGES_RESULT}" \
              --optional "full-stack-heavy=${HEAVY_RESULT}"
          else
            echo "Unable to determine full-stack applicability"
            exit 1
          fi
