name: Full Stack E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'services/detect-web/**'
      - 'services/search-config/**'
      - 'services/ai-assistant/**'
      - 'services/api-gateway/**'
      - 'services/threat-web/**'
      - 'infra/**'
      - 'deploy/docker/minio/**'
      - '.github/workflows/full-stack.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: full-stack-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Avoid depending on third-party mirror synchronization in hosted CI.
  SOCP_MAVEN_SETTINGS: "none"

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOCP_JWT_SECRET: ci-full-stack-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_LOGIN_SECRET: ci-full-stack-jwt-secret-0123456789abcdef0123456789abcdef
      SOCP_SECURITY_SERVICE_SECRET: ci-full-stack-service-secret-0123456789abcdef
      SOCP_SECURITY_METRICS_TOKEN: ci-full-stack-metrics-token-0123456789abcdef
      SOCP_SECURITY_ALLOW_PROD_HMAC: "true"
      SOCP_PG_BOOTSTRAP_PASSWORD: ci-full-stack-pg-admin-password-0123456789abcdef
      SOCP_PG_USER: socp_runtime
      SOCP_PG_PASSWORD: ci-full-stack-pg-runtime-password-0123456789abcdef
      SOCP_PG_RUNTIME_USER: socp_runtime
      SOCP_PG_RUNTIME_PASSWORD: ci-full-stack-pg-runtime-password-0123456789abcdef
      SOCP_PG_MIGRATION_USER: socp_migrator
      SOCP_PG_MIGRATION_PASSWORD: ci-full-stack-pg-migration-password-0123456789abcdef
      SOCP_CK_PASSWORD: ci-full-stack-ck-password-0123456789abcdef
      SOCP_MINIO_SECRET: ci-full-stack-minio-secret-0123456789abcdef
      SOCP_OPENSEARCH_PASSWORD: Ci-full-stack-OS!2026-0123456789abcdef
      SOCP_RUNTIME_PROFILES: dev,pg
      # Both the production-context boot smoke and the live dev,pg SOAR
      # instances must target the Temporal service started below.
      SOCP_TEMPORAL_TARGET: localhost:7233
      SOCP_RATELIMIT_BACKEND: redis
      SOCP_RATELIMIT_FAIL_CLOSED: "true"
      SOCP_CLIENT_EXTERNAL_ALLOWED_HOSTS: "127.0.0.1,localhost"
      SOCP_CLIENT_EXTERNAL_HTTPS_ONLY: "false"
      SOCP_CLIENT_EXTERNAL_ALLOW_PRIVATE_NETWORKS: "true"
      SOCP_WEBHOOK_FIXTURE_PORT: "38421"
      SOCP_WEBHOOK_FIXTURE_URL: http://127.0.0.1:38421/notify
      # Fifteen Spring Boot processes plus Kafka/OpenSearch/ClickHouse run on one
      # hosted runner. Keep the evidence job inside a predictable memory budget.
      SOCP_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      # search-config also owns the Kafka-to-OpenSearch indexing worker. Kafka
      # client reinitialization after a broker outage needs more class metadata
      # headroom than the CRUD-oriented services, without increasing all JVMs.
      SOCP_SEARCH_CONFIG_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Detection includes routing, JPA, Kafka and runtime OpenAPI generation;
      # the generic 128 MiB metadata cap exhausts Metaspace after startup.
      SOCP_DETECT_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # Alert also loads enrichment, delivery, JPA and OpenAPI. Its first
      # paginated alarm request exceeds the generic metadata budget.
      SOCP_ALERT_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # SOAR loads the Temporal, connector, auth, and JPA stacks in one JVM.
      # Its steady-state metadata exceeds the generic 128 MiB evidence budget
      # under concurrent alarm evaluation, so keep the override service-local.
      SOCP_SOAR_WEB_JVM_OPTS: "-Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      # The PostgreSQL container defaults to 100 connections. Hikari otherwise
      # reserves up to ten per JVM and exhausts the shared database during the
      # 15-service startup burst.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SOCP_COLLECTOR_CREDENTIALS: "ci-chaos|default|ci-chaos-collector-secret-0123456789abcdef"
      SOCP_ALLOW_GLOBAL_INGEST_TOKEN: "false"
      PIPELINE_INGEST_URL: http://127.0.0.1:18081/search-config/api/v1/ingest
      PIPELINE_COLLECTOR_ID: ci-chaos
      PIPELINE_COLLECTOR_TOKEN: ci-chaos-collector-secret-0123456789abcdef
      PIPELINE_OS: https://localhost:9200
      PIPELINE_OS_AUTH: "admin:Ci-full-stack-OS!2026-0123456789abcdef"
      PIPELINE_CK: http://localhost:8123
      PIPELINE_CK_AUTH: "default:ci-full-stack-ck-password-0123456789abcdef"
      PIPELINE_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up pnpm and Node 22
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Start integration middleware
        # Full-stack verification does not require dashboards, Keycloak,
        # Temporal UI, Loki, or Jaeger. Temporal itself is required: SOAR must
        # prove durable dispatch rather than silently accepting a queued-only
        # run when the orchestration dependency is absent.
        run: >-
          bash build/compose.sh up -d --wait --wait-timeout 180
          postgres kafka opensearch redis clickhouse minio

      - name: Start Temporal for SOAR evidence
        run: >-
          bash build/compose.sh --profile extra up -d
          temporal

      - name: Wait for Temporal namespace and verify database ownership
        run: |
          python3 - <<'PY'
          import subprocess
          import time

          deadline = time.monotonic() + 180
          last_output = ""
          while time.monotonic() < deadline:
              try:
                  probe = subprocess.run([
                      "bash", "build/compose.sh", "--profile", "extra", "exec", "-T",
                      "temporal", "temporal", "--address", "temporal:7233",
                      "operator", "namespace", "describe", "-n", "default",
                  ], capture_output=True, text=True, timeout=10)
                  last_output = probe.stdout + probe.stderr
                  if probe.returncode == 0:
                      print("Temporal default namespace is reachable through gRPC")
                      break
              except subprocess.TimeoutExpired:
                  last_output = "Temporal namespace probe timed out"
              time.sleep(2)
          else:
              raise SystemExit("Temporal namespace did not become ready: " + last_output)
          PY
          docker exec -i socp-postgres psql -U socp -d template1 -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('socp_migrator', 'socp_runtime')
                       AND (rolsuper OR rolcreatedb OR rolbypassrls)) THEN
              RAISE EXCEPTION 'Temporal bootstrap widened application role privileges';
            END IF;
            IF (SELECT count(*) FROM pg_database WHERE datname IN ('temporal', 'temporal_visibility')
                AND pg_get_userbyid(datdba) = 'socp_migrator') <> 2 THEN
              RAISE EXCEPTION 'Temporal databases do not have the expected restricted owner';
            END IF;
            IF has_database_privilege('socp_runtime', 'temporal', 'CONNECT')
               OR has_database_privilege('socp_runtime', 'temporal_visibility', 'CONNECT') THEN
              RAISE EXCEPTION 'application runtime role can access Temporal internal databases';
            END IF;
          END $$;
          SQL

      - name: Build backend
        run: bash build/mvnw.sh -DskipTests package

      - name: Boot every packaged service with a production-like context
        env:
          SOCP_AUTH_COOKIE_SECURE: "true"
          SOCP_TENANT_RLS_ENABLED: "true"
          SOCP_AUDIT_SINK: kafka
          SOCP_AUDIT_FAIL_CLOSED: "true"
          SOCP_OPENSEARCH_ENABLED: "false"
          SOCP_OPENSEARCH_USERNAME: ci-prod-smoke
          SOCP_OPENSEARCH_INSECURE_SKIP_VERIFY: "false"
          SOCP_INGEST_TOKEN: ci-chaos-collector-secret-0123456789abcdef
          SOCP_VECTOR_TOKEN: ci-chaos-collector-secret-0123456789abcdef
          SOCP_SOAR_ARTIFACT_S3_ENDPOINT: https://localhost:19443
          SOCP_SOAR_ARTIFACT_S3_BUCKET: socp-soar-artifacts
        run: |
          set -euo pipefail
          # Use a real TLS endpoint and projected secret files for prod guards.
          source infra/middleware-images.env
          cleanup() {
            docker logs socp-minio-prod-smoke > .cache/prod-boot/minio-tls.log 2>&1 || true
            docker rm -f socp-minio-prod-smoke >/dev/null 2>&1 || true
            rm -rf -- .cache/prod-boot/minio-certs .cache/prod-boot/secrets .cache/prod-boot/minio-truststore.p12
          }
          trap cleanup EXIT
          mkdir -p .cache/prod-boot/minio-certs .cache/prod-boot/secrets/platform/soar-artifacts
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout .cache/prod-boot/minio-certs/private.key \
            -out .cache/prod-boot/minio-certs/public.crt
          keytool -importcert -noprompt -alias ci-minio \
            -file .cache/prod-boot/minio-certs/public.crt \
            -keystore .cache/prod-boot/minio-truststore.p12 -storepass changeit
          printf '%s' socp_minio > .cache/prod-boot/secrets/platform/soar-artifacts/access-key
          printf '%s' "$SOCP_MINIO_SECRET" > .cache/prod-boot/secrets/platform/soar-artifacts/secret-key
          export SOCP_SOAR_K8S_SECRET_MOUNT_PATH="$PWD/.cache/prod-boot/secrets"
          export JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=$PWD/.cache/prod-boot/minio-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
          collector_expiration="$(python3 -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)+timedelta(days=1)).isoformat())')"
          export SOCP_COLLECTOR_CREDENTIALS="${SOCP_COLLECTOR_CREDENTIALS}|${collector_expiration}"
          docker run -d --name socp-minio-prod-smoke -p 127.0.0.1:19443:9000 \
            -v "$PWD/.cache/prod-boot/minio-certs:/certs:ro" \
            -e MINIO_ROOT_USER=socp_minio -e "MINIO_ROOT_PASSWORD=$SOCP_MINIO_SECRET" \
            --entrypoint /usr/bin/minio "$SOCP_MINIO_IMAGE" server /data --certs-dir /certs
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            --cacert .cache/prod-boot/minio-certs/public.crt \
            https://localhost:19443/minio/health/live
          python3 build/verify-prod-boot.py
          # Assert PostgreSQL's actual type and published migration history,
          # using the same database that the packaged service just upgraded.
          bash build/compose.sh exec -T -e "PGPASSWORD=$SOCP_PG_MIGRATION_PASSWORD" \
            postgres psql -h localhost -U "$SOCP_PG_MIGRATION_USER" -d threat -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 't_ioc'
                           AND column_name = 'confidence' AND data_type = 'double precision') THEN
              RAISE EXCEPTION 'confidence did not migrate to double precision';
            END IF;
            IF to_regtype('double') IS NOT NULL THEN
              RAISE EXCEPTION 'migration compatibility domain leaked into the fresh database';
            END IF;
            IF (SELECT count(*) FROM flyway_schema_history WHERE success AND version IN ('1','2','3','4','5')) <> 5 THEN
              RAISE EXCEPTION 'published threat migration history is incomplete';
            END IF;
          END $$;
          SQL

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build and verify frontend
        run: pnpm verify
        working-directory: frontend/apps/workbench

      - name: Install pipeline probe dependency
        run: python3 -m pip install kafka-python==3.0.10

      - name: Start all backend services
        run: bash build/run-all.sh backend full

      - name: Verify Actuator authentication boundary
        env:
          SOCP_GATEWAY_URL: http://127.0.0.1:18092
        run: python3 build/verify-actuator-auth.py

      - name: Verify generated SDK against runtime SOAR OpenAPI
        env:
          SOAR_OPENAPI_BASE_URL: http://127.0.0.1:18092/soar-web
          SOCP_GATEWAY_URL: http://127.0.0.1:18092
          SOAR_OPENAPI_REQUIRE_RUNTIME: "true"
          SOAR_OPENAPI_OUTPUT: .cache/openapi-sdk
          SOAR_VERIFY_USERNAME: admin
          SOAR_VERIFY_PASSWORD: admin123
        run: python3 build/verify-openapi-sdk.py

      - name: Start a second SOAR instance for admission evidence
        run: |
          mkdir -p .cache
          read -r -a secondary_jvm_args <<< "${SOCP_SOAR_WEB_JVM_OPTS:--Xms16m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC}"
          nohup java "${secondary_jvm_args[@]}" \
            -jar services/soar-web/target/soar-web-1.0.0-SNAPSHOT.jar \
            --server.port=28083 --spring.profiles.active=dev,pg \
            --spring.main.banner-mode=off \
            > .cache/soar-web-secondary.log 2>&1 &
          echo $! > .cache/soar-web-secondary.pid
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          target = "http://127.0.0.1:28083/soar-web/health"
          for _ in range(90):
              try:
                  with urllib.request.urlopen(target, timeout=2) as response:
                      body = json.loads(response.read().decode("utf-8"))
                      details = body.get("data", body)
                      temporal = details.get("temporal", {}) if isinstance(details, dict) else {}
                      if (response.status == 200 and details.get("status") == "UP"
                              and temporal.get("status") == "UP"):
                          print("secondary SOAR instance and Temporal are reachable")
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("secondary SOAR instance did not become reachable")
          PY

      - name: Run SOAR live and multi-instance verification
        env:
          SOAR_PRIMARY_URL: http://127.0.0.1:18092/soar-web
          SOAR_SECONDARY_URL: http://127.0.0.1:28083/soar-web
          SOAR_REQUIRE_SECONDARY: "true"
          SOAR_LIVE_EVIDENCE_PATH: .cache/soar-live.json
          SOAR_VERIFY_USERNAME: admin
          SOAR_VERIFY_PASSWORD: admin123
        run: python3 build/verify-soar-live.py

      - name: Start persistent webhook verification fixture
        run: |
          mkdir -p .cache
          python3 build/webhook-sink.py --port "$SOCP_WEBHOOK_FIXTURE_PORT" \
            > .cache/webhook-sink.log 2>&1 &
          echo $! > .cache/webhook-sink.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${SOCP_WEBHOOK_FIXTURE_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .cache/webhook-sink.log
          exit 1

      - name: Run full API verification
        run: python3 build/verify-full.py

      - name: Run true event-pipeline verification
        run: python3 build/verify-pipeline.py

      - name: Run Compose-backed dependency chaos evidence
        run: |
          mkdir -p .cache/chaos
          python3 build/chaos-pipeline.py --scenario all \
            --run-id "weekly-dependency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/dependency-matrix.json

      # This demo stops the only canonical consumer. Run it before replacing
      # that generation with three routed consumers and their separate router.
      - name: Run Detection recovery demo
        run: python3 build/demos/detection-recovery.py

      - name: Start fixed three-instance routed Detection cluster
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_DETECT_INPUT_TOPIC: socp-detection-routed-v2
          SOCP_DETECT_ROUTING_MODE: primary
          SOCP_DETECT_OUTPUT_MODE: primary
          SOCP_DETECT_ROUTING_PUBLISHER_ENABLED: "true"
          SOCP_DETECT_CLUSTER_MIN_PARTITIONS: "6"
        run: bash build/detection-cluster.sh start

      - name: Run weekly routed multi-instance chaos evidence
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_DETECT_INPUT_TOPIC: socp-detection-routed-v2
          SOCP_DETECT_ROUTING_MODE: primary
          SOCP_DETECT_OUTPUT_MODE: primary
          SOCP_DETECT_ROUTING_PUBLISHER_ENABLED: "true"
          SOCP_DETECT_ROUTING_SOURCE_TOPIC: socp-events
          SOCP_DETECT_ROUTING_SOURCE_GROUP_ID: socp-detect-router-v2
          RECOVERY_TOPIC: socp-detection-routed-v2
          SOCP_REQUIRE_DOWNSTREAM_DRAIN: "true"
          DETECTION_INSTANCE_URLS: http://127.0.0.1:18082,http://127.0.0.1:28082,http://127.0.0.1:38082
        run: |
          mkdir -p .cache/chaos
          python3 build/chaos-pipeline.py --scenario multi_instance --count 30 \
            --rebalance-cycles 3 --run-id "weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/multi-instance.json

      - name: Run routed migration and rollback evidence
        env:
          SOCP_DETECT_PROFILE: pg
          SOCP_KAFKA_GROUP_ID: socp-detect
          SOCP_DETECT_INPUT_TOPIC: socp-detection-routed-v2
          SOCP_DETECT_ROUTING_MODE: primary
          SOCP_DETECT_OUTPUT_MODE: primary
          SOCP_DETECT_ROUTING_PUBLISHER_ENABLED: "true"
          SOCP_DETECT_ROUTING_SOURCE_TOPIC: socp-events
          SOCP_DETECT_ROUTING_SOURCE_GROUP_ID: socp-detect-router-v2
          RECOVERY_TOPIC: socp-detection-routed-v2
          DETECTION_INSTANCE_URLS: http://127.0.0.1:18082,http://127.0.0.1:28082,http://127.0.0.1:38082
        run: |
          python3 build/chaos-pipeline.py --scenario routed_migration --count 20 \
            --run-id "weekly-mig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/routed-migration.json
          python3 build/chaos-pipeline.py --scenario routing_rollback --count 20 \
            --run-id "weekly-rrb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output .cache/chaos/routing-rollback.json

      - name: Run Golden Demo
        run: python3 build/demos/golden-demo.py --transport ingest

      - name: Run attack scenario demo
        run: python3 build/demos/attack-scenarios.py

      - name: Run dependency failure injection
        run: python3 build/failure-tests.py

      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache
          bash build/compose.sh --profile extra logs --no-color > .cache/compose.log 2>&1 || true

      - name: Collect commit-scoped full-stack evidence
        if: always()
        run: |
          python3 build/collect-evidence.py --output .cache/evidence \
          --benchmark .cache/chaos/dependency-matrix.json \
          --benchmark .cache/chaos/multi-instance.json

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-stack-e2e-logs
          path: .cache/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          if [ -f .cache/webhook-sink.pid ]; then
            kill "$(cat .cache/webhook-sink.pid)" 2>/dev/null || true
          fi
          if [ -f .cache/soar-web-secondary.pid ]; then
            kill "$(cat .cache/soar-web-secondary.pid)" 2>/dev/null || true
          fi
          bash build/detection-cluster.sh stop || true
          bash build/run-all.sh stop || true
          bash build/compose.sh --profile extra down || true
