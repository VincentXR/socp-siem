# ============================================================================
# SOCP / SEARCH 采集流水线 —— Vector 配置（端点 Agent 侧）
#
# 角色：Vector 只做「采集 + 传输」，解析/检索/告警归 SEARCH 与 OpenSearch。
# 本文件可由 search-config 服务动态渲染（POST /search-config/api/v1/render），
# 这里保留的是「参考模板」，与渲染产物一致。
#
# 二进制：本仓同级 tooling/vector/bin/vector.exe（v0.57.0，MPL-2.0）
# 校验：   vector validate --no-environment vector.toml
# 启动：   vector --config vector.toml
#
# 数据流向：
#   [sources] 文件尾部 / syslog / kafka
#     → [transforms.gls_normalize] 规范化元数据
#       → [sinks.gls_ingest] NDJSON POST 到 SEARCH /api/v1/ingest
# ============================================================================

# ---------- 数据源 1：文件尾部监听 ----------
[sources.siem_files]
type = "file"
# Docker 运行：仓库根挂载到 /demo（见 run-vector.sh），容器内路径 /demo/sample.log
include = ["/demo/sample.log"]
# 每次启动从文件末尾开始，不重放历史行
read_from = "end"
data_dir = "/var/lib/vector"

# ---------- 数据源 2：syslog（TCP，避免 514 特权端口） ----------
[sources.siem_syslog]
type = "syslog"
address = "0.0.0.0:5514"
mode = "tcp"

# ---------- 采集器自身指标 ----------
[sources.siem_internal]
type = "internal_metrics"

# ---------- 归一化：整理元数据，正文保持原样（解析权归 SEARCH） ----------
[transforms.gls_normalize]
type = "remap"
inputs = ["siem_files", "siem_syslog"]
source = '''
.message = string!(.message)
if exists(.host) {
  .collector_host = del(.host)
}
if !exists(.collector_host) {
  .collector_host = "vector-local"
}
.ingested_at = format_timestamp!(now(), format: "%+")

# 行内 JSON 解包：file/syslog 采集的 JSON 行（Falco/采集器包装行）展开到顶层，
# 让 SEARCH 的 JsonParser 吃完整事件（与 verify 脚本直接 POST 的格式一致），
# 否则 host/src_ip/user 全在嵌套 message 字符串里，canonical 解析不出实体。
if is_json(.message) {
  parsed = parse_json(.message) ?? {}
  . = merge!(., parsed)
}

.parse_format = "auto"
if exists(.port) { del(.port) }
'''

# ---------- 转发：NDJSON 批量 POST 给 SEARCH ingest ----------
[sinks.gls_ingest]
type = "http"
inputs = ["gls_normalize"]
# Docker Desktop (Windows/WSL2) 下容器内 localhost 不等于宿主，必须走 host.docker.internal；
# 原生运行（宿主机装 vector.exe）时改回 localhost。
uri = "http://host.docker.internal:18081/search-config/api/v1/ingest"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
healthcheck.enabled = false
batch.max_events = 100
batch.timeout_secs = 2
request.retry_attempts = 5
request.retry_backoff_secs = 2
request.timeout_secs = 30
# 机机采集凭据：与 search-config socp.security.ingest-token 一致（dev-bypass=false 时必须）。
# 运行期由 run-vector.sh 用 sed 替换 __VECTOR_TOKEN__ 为实际值（Vector 配置模板的 ${VAR} 展开不可靠）。
request.headers.Authorization = "Bearer __VECTOR_TOKEN__"
buffer.type = "disk"
buffer.max_size = 268435488
buffer.when_full = "block"

# ---------- 采集器自身指标（可选） ----------
[sinks.siem_metrics]
type = "prometheus_exporter"
inputs = ["siem_internal"]
address = "0.0.0.0:9598"
